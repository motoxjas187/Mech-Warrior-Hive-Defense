name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MechSiege-build${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MechSiege-apk
          path: MechSiege-build${{ github.run_number }}.apk

      - name: Publish release (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mech Siege build ${{ github.run_number }}
          make_latest: true
          body: |
            Download **MechSiege-build${{ github.run_number }}.apk** below and open it on your phone.
            Allow "Install unknown apps" for your browser if Android asks.
          files: MechSiege-build${{ github.run_number }}.apk
