<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mech Siege: Hive War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c131a;--panel:#111b25;--card:#142130;--line:#27405a;--cyan:#3fe0ff;--orange:#ffa62b;--text:#e2ecf5;--dim:#7f93a6;--red:#ff4d5e;--green:#5dff9b;--purple:#b77bff;--pink:#ff4d9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#05080c;color:var(--text);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.mono{font-family:'Share Tech Mono',monospace}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
/* header */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px 4px;background:linear-gradient(#101a24,#0c131a)}
.ibtn{width:40px;height:40px;border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;position:relative;background:#0f1a24;flex:none}
.ibtn svg{width:22px;height:22px}
#misDot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);display:none}
.money{flex:1;text-align:center;line-height:1}
.mrow{font-family:'Share Tech Mono',monospace;font-size:32px;letter-spacing:1px}
.mrow .dl{color:var(--orange);margin-right:6px}
#rate{color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:14px;margin-top:2px}
.gems{text-align:right;font-family:'Share Tech Mono',monospace;line-height:1.1}
.gems .big{font-size:22px}
.gems .gem{color:var(--cyan)}
.gems .sub{font-size:11px;color:var(--dim)}
#wavebar{padding:2px 12px 6px}
.wrow{display:flex;justify-content:space-between;align-items:center;font-family:'Share Tech Mono',monospace;font-size:15px}
#farmBtn{font-size:11px;border:1px solid var(--line);padding:2px 7px;margin-left:8px;border-radius:3px;color:var(--green)}
#farmBtn.farm{color:var(--orange);border-color:var(--orange)}
.pbar{height:6px;background:#0a1118;border:1px solid #2b4459;margin-top:3px;position:relative;overflow:hidden}
.pbar i{position:absolute;inset:0;width:0;background:var(--orange);transition:width .2s}
.pbar.hull{height:9px}
.pbar.hull i{background:linear-gradient(90deg,#29c7e8,#5ff0ff)}
.pbar.hull.low i{background:linear-gradient(90deg,#ff3045,#ff7a5a)}
#hullTxt{position:absolute;right:4px;top:-2px;font-size:9px;font-family:'Share Tech Mono',monospace;color:#d8f6ff;text-shadow:0 0 3px #000}
/* game */
#game{position:relative;flex:0 0 auto;height:46vh;min-height:250px;max-height:470px;border-top:1px solid #1e3042;border-bottom:2px solid #1e3042;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toasts{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:3}
.toast{background:rgba(8,14,20,.88);border:1px solid var(--line);padding:4px 10px;font-size:12px;border-radius:3px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#boost{position:absolute;left:8px;bottom:8px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(10,18,26,.88);border:1px solid var(--orange);padding:5px 9px;border-radius:3px;font-size:12px;line-height:1.1;text-align:left}
#boost b{color:var(--orange)}
#boost small{color:var(--dim);display:block}
#boost.cd{border-color:var(--line);opacity:.75}
#spd{position:absolute;left:8px;bottom:60px;z-index:4;background:rgba(10,18,26,.88);border:1px solid var(--cyan);color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:14px;padding:6px 11px;border-radius:3px}
#spd.x2{background:var(--cyan);color:#06222b;box-shadow:0 0 12px var(--cyan)}
#abil{position:absolute;right:8px;bottom:8px;display:flex;gap:7px;z-index:2}
.ab{width:50px;height:50px;border-radius:50%;position:relative;background:conic-gradient(rgba(0,0,0,.65) calc(var(--p,0)*1%),transparent 0),radial-gradient(#1b2c3c,#0d1720);border:2px solid var(--cyan);display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:.5px}
.ab svg{width:22px;height:22px;margin-top:-6px}
.ab span{position:absolute;bottom:5px}
.ab.lock{border-color:#33475a;opacity:.45}
.ab.ready{box-shadow:0 0 10px var(--cyan)}
.ab.active{border-color:var(--orange);box-shadow:0 0 14px var(--orange)}
/* panel */
#panel{flex:1;overflow-y:auto;padding:10px 10px 14px;background:var(--panel);-webkit-overflow-scrolling:touch}
#panel::-webkit-scrollbar{width:4px}#panel::-webkit-scrollbar-thumb{background:#2a3f52}
.card{position:relative;background:var(--card);border:1px solid #23394d;margin-bottom:9px;padding:9px}
.card:before,.card:after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--cyan);pointer-events:none}
.card:before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.card:after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.h{font-size:13px;color:var(--dim);letter-spacing:1px;margin:4px 2px 8px;text-transform:uppercase}
.h b{color:var(--cyan)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:5px 9px;font-size:12px;font-family:'Share Tech Mono',monospace;color:var(--dim)}
.seg button.on{background:var(--cyan);color:#06222b}
.wcard{display:flex;align-items:center;gap:10px}
.wico{width:52px;height:52px;flex:none;border:1px solid #2b4459;display:grid;place-items:center;background:#0d1822}
.wico svg{width:40px;height:40px}
.wmid{flex:1;min-width:0}
.wname{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar{height:6px;background:#0a1118;margin:5px 0 4px;position:relative}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
.wsub{font-size:12px;color:var(--dim);font-family:'Share Tech Mono',monospace;display:flex;gap:10px}
.wsub .ms{color:var(--orange)}
.buy{flex:none;min-width:94px;padding:6px 8px;border:1px solid var(--cyan);background:#0f2532;text-align:right;font-family:'Share Tech Mono',monospace;line-height:1.15}
.buy small{display:block;font-size:11px;color:var(--cyan)}
.buy b{font-size:15px;font-weight:400}
.buy b em{color:var(--orange);font-style:normal}
.buy.dis{border-color:#2a3a48;background:#121c26;color:#677a8c}
.buy.dis small{color:#55697b}
.buy.max{border-color:#2a3a48;color:var(--green)}
.unlock{width:100%;background:var(--orange);color:#1a1205;font-size:18px;font-family:'Share Tech Mono',monospace;padding:16px;margin-bottom:9px;font-weight:700;letter-spacing:1px;position:relative}
.unlock.dis{background:#5b4523;color:#2c2210}
.unlock small{display:block;font-size:11px;font-weight:400;opacity:.8;letter-spacing:0}
.locked{opacity:.4;font-size:13px;padding:12px;text-align:center;letter-spacing:2px}
.wico{position:relative}.edot{position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor}
.wtag{font-size:11px;color:var(--dim);font-family:'Share Tech Mono',monospace}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{border:2px solid;background:#0f1a24;padding:9px;display:flex;flex-direction:column;min-width:0}
.dcard .wname{font-size:15px;line-height:1.15;margin-top:4px}
.dico{width:60px;height:60px;margin:6px auto 2px;border:1px solid #2b4459;display:grid;place-items:center;position:relative;background:#0b141c}.dico svg{width:46px;height:46px}
.wl{font-size:11.5px;color:#b9c7d4;margin-top:6px;line-height:1.35}.wl.stats{color:var(--cyan);font-family:'Share Tech Mono',monospace;flex:1}
.newb{font-size:10px;background:var(--green);color:#062a14;padding:1px 6px;font-weight:700;letter-spacing:1px}
/* tree */
.node{display:flex;align-items:center;gap:8px;position:relative}
.node .nm{flex:1;min-width:0}
.node .nm b{font-size:14px;font-weight:600;display:block}
.node .nm small{font-size:11.5px;color:var(--dim)}
.node .lv{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--cyan)}
.tree-d1{margin-left:18px}.tree-d2{margin-left:36px}
.tree-d1:before,.tree-d2:before{}
.branch{position:absolute;left:-12px;top:-10px;bottom:50%;width:10px;border-left:2px solid #2b4a63;border-bottom:2px solid #2b4a63}
.nlock{opacity:.45}
/* modules */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mod{aspect-ratio:1;border:2px solid #2a3a48;background:#0d1822;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-family:'Share Tech Mono',monospace;position:relative;line-height:1.1;text-align:center}
.mod .mi{font-size:18px;font-family:'Chakra Petch';font-weight:700}
.mod.empty{border-style:dashed;color:#41566a}
.mod .cnt{position:absolute;top:1px;right:3px;font-size:9px;color:var(--dim)}
.btn{border:1px solid var(--cyan);padding:8px 12px;font-size:13px;background:#0f2532}
.btn.o{border-color:var(--orange);color:var(--orange);background:#2a1d0c}
.btn.dis{opacity:.4}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed #22364a}
.stat b{font-family:'Share Tech Mono',monospace;font-weight:400;color:var(--cyan)}
/* nav */
#nav{display:flex;justify-content:space-between;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0b1219;border-top:1px solid #1e3042}
#nav button{flex:1;height:52px;border:2px solid #24384b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:1px;color:var(--dim);position:relative;background:#0f1923}
#nav button svg{width:24px;height:24px;margin-bottom:2px}
#nav button.on{color:var(--orange);border-color:transparent;background:#14202b}
#nav button.on:before,#nav button.on:after{content:'';position:absolute;width:12px;height:12px;border:3px solid var(--orange)}
#nav button.on:before{left:-2px;top:-2px;border-right:0;border-bottom:0}
#nav button.on:after{right:-2px;bottom:-2px;border-left:0;border-top:0}
/* modal */
#modal{position:absolute;inset:0;background:rgba(3,6,10,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
#modal.on{display:flex}
.mbox{width:100%;max-width:420px;max-height:88%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);padding:16px;position:relative}
.mbox h2{margin:0 0 10px;font-size:20px;letter-spacing:1px}
.mbox .x{position:absolute;right:10px;top:8px;font-size:22px;color:var(--dim)}
.mis{display:flex;align-items:center;gap:10px}
.mis .nm{flex:1;font-size:14px}
.mis .pb{height:5px;background:#0a1118;margin-top:5px}
.mis .pb i{display:block;height:100%;background:var(--green)}
.note{font-size:12px;color:var(--dim);line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ibtn" data-act="missions" aria-label="Missions"><svg viewBox="0 0 24 24" fill="none" stroke="#ffa62b" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="1"/><path d="M9 4V2h6v2M8 10l2 2 4-4M8 16h8"/></svg><i id="misDot"></i></button>
    <div class="money"><div class="mrow"><span class="dl">$</span><span id="money">0</span></div><div id="rate">0/s</div></div>
    <div class="gems"><div class="big"><span id="crys">0</span> <span class="gem">◆</span></div><div class="sub" id="coresTxt">Cores 0</div></div>
    <button class="ibtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="#7f93a6" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
  <div id="wavebar">
    <div class="wrow"><span><span id="waveTxt">Wave 1</span><button id="farmBtn" data-act="farm">AUTO ▶</button></span><span id="waveCnt">0/0</span></div>
    <div class="pbar"><i id="wp"></i></div>
    <div class="pbar hull" id="hullBar"><i id="hp"></i><span id="hullTxt"></span></div>
  </div>
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="toasts"></div>
    <button id="boost" data-act="boost"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ffa62b"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span><b>Boost $x2</b><small id="boostTxt">+5 min</small></span></button>
    <button id="spd" data-act="speed">▶ 1×</button>
    <div id="abil">
      <button class="ab" data-act="ab" data-k="overdrive"><svg viewBox="0 0 24 24" fill="#ffa62b"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>OVRDRV</span></button>
      <button class="ab" data-act="ab" data-k="orbital"><svg viewBox="0 0 24 24" fill="none" stroke="#3fe0ff" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6"/></svg><span>ORBITAL</span></button>
      <button class="ab" data-act="ab" data-k="repair"><svg viewBox="0 0 24 24" fill="#5dff9b"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg><span>REPAIR</span></button>
    </div>
  </div>
  <div id="panel"></div>
  <div id="nav">
    <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>SHOP</button>
    <button data-tab="mech" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h8v3h3v6h-3v2h2v7h-4v-5h-4v5H6v-7h2v-2H5V6h3z"/></svg>MECH</button>
    <button data-tab="tree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5L6 16.5M12 11.5l6 5"/></svg>TREE</button>
    <button data-tab="armory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M17.5 14v7M14 17.5h7"/></svg>ARMORY</button>
    <button data-tab="reboot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6 6 1-4.5 4.3 1 6.2L12 16.6 6.5 19.5l1-6.2L3 9l6-1z"/></svg>REBOOT</button>
  </div>
  <div id="modal"><div class="mbox" id="mbox"></div></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();
  const e=Math.floor(Math.log10(n)/3);let s;
  if(e<SUF.length)s=SUF[e];else{const k=e-SUF.length;s=String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26);}
  const v=n/Math.pow(1000,e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+s;
}

/* ================= DATA ================= */
/* ---- 12,000-weapon pool: 10 bases x 20 prefixes x 5 elements x 12 suffixes (HORDEFALL-style) ---- */
const HPT=[ // hardpoint tiers: unlock cost, level cost, growth, dps per level
  {unlock:0,cost:10,r:1.12,dps:5},{unlock:400,cost:250,r:1.125,dps:55},{unlock:12e3,cost:7e3,r:1.13,dps:800},
  {unlock:4e5,cost:2.2e5,r:1.135,dps:1.3e4},{unlock:1.2e7,cost:7e6,r:1.14,dps:2.4e5},{unlock:4e8,cost:2.5e8,r:1.145,dps:5e6}];
const BASES=[
  {id:'minigun',name:'Minigun',kind:'bullet',rate:12,spread:.10,spd:1000,dmg:1,ic:'cannon',desc:'Rapid tracer stream'},
  {id:'rifle',name:'Battle Rifle',kind:'bullet',rate:5,spread:.03,spd:1250,pierce:1,dmg:1.05,ic:'rail',desc:'Accurate rounds that pierce 1'},
  {id:'shotgun',name:'Scattergun',kind:'bullet',rate:1.4,pellets:6,spread:.42,spd:850,range:240,dmg:1.3,ic:'cannon',desc:'Close-range pellet blast'},
  {id:'sniper',name:'Longshot',kind:'bullet',rate:.7,spd:1800,pierce:3,dmg:1.1,big:true,ic:'rail',desc:'Hunts the toughest foe, pierces 3'},
  {id:'rocket',name:'Rocket Pod',kind:'missile',rate:.9,pellets:3,spd:180,aoe:55,dmg:.9,homing:true,ic:'missile',desc:'Homing splash volleys'},
  {id:'laser',name:'Pulse Laser',kind:'beam',rate:10,dmg:1,ic:'laser',desc:'Continuous beam'},
  {id:'tesla',name:'Tesla Coil',kind:'chain',rate:2,chains:5,dmg:1,ic:'tesla',desc:'Lightning chains through 5 foes'},
  {id:'flamer',name:'Flamethrower',kind:'cone',rate:12,range:210,dmg:1.3,ic:'flamer',desc:'Short cone, hits everything in it'},
  {id:'rail',name:'Railgun',kind:'rail',rate:.45,dmg:1.05,ic:'rail',desc:'Pierces everything, ignores armor'},
  {id:'mortar',name:'Plasma Mortar',kind:'mortar',rate:.7,aoe:80,dmg:.85,ic:'missile',desc:'Lobbed plasma, huge blast'},
];
const PREFIX=[
  ['Rapid','+35% fire rate',s=>{s.rate*=1.35}],
  ['Heavy','+50% damage, -20% fire rate',s=>{s.dmgM*=1.5;s.rate*=.8}],
  ['Piercing','+2 pierce / +2 chain jumps',s=>{s.pierce+=2;s.chains+=2;s.dmgM*=1.05}],
  ['Twin','+1 projectile / target',s=>{s.pellets+=1;s.spread+=.05}],
  ['Volatile','Hits explode',s=>{s.aoe=Math.max(s.aoe,34)*1.3;s.dmgM*=.95}],
  ['Vampiric','Hits repair your hull',s=>{s.leech=1;s.dmgM*=1.05}],
  ['Lucky','+10% crit chance',s=>{s.crit+=.10}],
  ['Long','+40% range & velocity, +10% damage',s=>{if(s.range)s.range*=1.4;s.spd*=1.4;s.dmgM*=1.1}],
  ['Swift','+40% velocity, +15% fire rate',s=>{s.spd*=1.4;s.rate*=1.15}],
  ['Scatter','+2 projectiles, -20% damage',s=>{s.pellets+=2;s.spread+=.15;s.dmgM*=.8}],
  ['Precise','Tight spread, +5% crit, +15% damage',s=>{s.spread*=.4;s.crit+=.05;s.dmgM*=1.15}],
  ['Brutal','+75% crit damage',s=>{s.critMult+=.75}],
  ['Ancient','+30% damage, +10% fire rate',s=>{s.dmgM*=1.3;s.rate*=1.1}],
  ['Cursed','+110% damage, -30% fire rate',s=>{s.dmgM*=2.1;s.rate*=.7}],
  ['Overcharged','+20% fire rate & velocity',s=>{s.rate*=1.2;s.spd*=1.2}],
  ['Seeking','Projectiles home in, +10% damage',s=>{s.homing=true;s.dmgM*=1.1}],
  ['Ricochet','Bounces to new foes',s=>{s.perk='ricochet'}],
  ['Splitting','Hits burst into 4 shards',s=>{s.perk='split'}],
  ['Storm','Hits arc to 3 nearby foes',s=>{s.perk='storm'}],
  ['Nova','18% chance hits explode',s=>{s.perk='nova'}],
];
const ELEM=[
  {id:'fire',w:'Inferno',col:'#ff6a2a',desc:'Fire: burns for 35% of the hit per second, 3s'},
  {id:'ice',w:'Frost',col:'#7fd8ff',desc:'Ice: slows foes by 45% for 2s'},
  {id:'shock',w:'Volt',col:'#b48cff',desc:'Shock: 30% chance to arc to 2 foes'},
  {id:'poison',w:'Venom',col:'#7dff5a',desc:'Poison: stacking damage over time'},
  {id:'void',w:'Void',col:'#c35bff',desc:'Void: executes foes under 18% HP (6% bosses)'},
];
const WRAR=[['Common','#b8bfd0',1],['Uncommon','#5be37d',1.3],['Rare','#4aa8ff',1.7],['Epic','#c06bff',2.3],['Legendary','#ffa53a',3.2],['Mythic','#ff3d5a',4.8]];
const SUFFIX=[

const cv=$('#cv'),ctx=cv.getContext('2d');

function isoBox(g,x,y,w,d,h,top,left,right){
  // x,y = front-bottom corner of footprint on ground
  g.fillStyle=left;g.beginPath();g.moveTo(x,y);g.lineTo(x-w,y-w/2);g.lineTo(x-w,y-w/2-h);g.lineTo(x,y-h);g.fill();
  g.fillStyle=right;g.beginPath();g.moveTo(x,y);g.lineTo(x+d,y-d/2);g.lineTo(x+d,y-d/2-h);g.lineTo(x,y-h);g.fill();
  g.fillStyle=top;g.beginPath();g.moveTo(x,y-h);g.lineTo(x-w,y-w/2-h);g.lineTo(x-w+d,y-w/2-d/2-h);g.lineTo(x+d,y-d/2-h);g.fill();
}
function buildFloor(){
  floorCv=document.createElement('canvas');floorCv.width=cv.width;floorCv.height=cv.height;
  const g=floorCv.getContext('2d');g.setTransform(sc,0,0,sc,0,0);
  const grd=g.createLinearGradient(0,0,0,VH);grd.addColorStop(0,'#1f2a34');grd.addColorStop(1,'#151d25');
  g.fillStyle=grd;g.fillRect(0,0,VW,VH);
  // iso tiles
  const s=48;let seed=7;const sr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(let i=-30;i<30;i++)for(let j=-30;j<30;j++){
    const cx=(i-j)*s/2+VW/2,cy=(i+j)*s/4+VH/2;if(cx<-s||cx>VW+s||cy<-s||cy>VH+s)continue;
    const v=sr();if(v<.35){g.fillStyle=v<.12?'rgba(0,0,0,.16)':'rgba(255,255,255,.025)';g.beginPath();g.moveTo(cx,cy-s/4);g.lineTo(cx+s/2,cy);g.lineTo(cx,cy+s/4);g.lineTo(cx-s/2,cy);g.fill();}
  }
  g.strokeStyle='rgba(140,170,195,.09)';g.lineWidth=1;
  for(let c=-VH*2;c<VW+VH*2;c+=s){g.beginPath();g.moveTo(c,0);g.lineTo(c+VH*2,VH);g.stroke();g.beginPath();g.moveTo(c,0);g.lineTo(c-VH*2,VH);g.stroke();}
  // neon seams
  g.save();g.globalCompositeOperation='lighter';
  const seam=(x1,y1,x2,y2)=>{for(const [w,a] of [[7,.06],[3,.18],[1.4,.9]]){g.strokeStyle=`rgba(63,224,255,${a})`;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}};
  seam(-10,VH*.42,VW*.58,VH*-.05);seam(VW*.62,VH*1.02,VW+10,VH*.72);
  g.restore();
  // scorch-like stains
  for(let i=0;i<14;i++){const x=sr()*VW,y=sr()*VH,r=10+sr()*30;const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba(0,0,0,.22)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);}
  // structures top-left
  isoBox(g,40,VH*.18,60,70,46,'#3a4652','#252e37','#2f3a45');
  isoBox(g,-10,VH*.33,40,40,30,'#34404b','#222a32','#2b353f');
  g.fillStyle='rgba(63,224,255,.55)';g.fillRect(55,VH*.18-40,14,3);
  // rocks
  for(let i=0;i<10;i++){const x=VW*.3+sr()*VW*.7,y=VH*.15+sr()*VH*.8,r=4+sr()*7;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x+2,y+r*.6,r*1.1,r*.5,0,0,TAU);g.fill();
    g.fillStyle='#3d4853';g.beginPath();g.moveTo(x-r,y);g.lineTo(x-r*.4,y-r*1.4);g.lineTo(x+r*.6,y-r*1.1);g.lineTo(x+r,y);g.lineTo(x,y+r*.5);g.fill();
    g.fillStyle='#55626e';g.beginPath();g.moveTo(x-r*.4,y-r*1.4);g.lineTo(x+r*.6,y-r*1.1);g.lineTo(x+r*.1,y-r*.3);g.fill();}
}

  R.sq.push(sq);
  const type=pickType(S.wave);
  for(let i=0;i<n;i++){
    const t=i===0||Math.random()<.7?type:pickType(S.wave);
    const e=mkEnemy(t,sx+rnd(-18,18),sy+rnd(-18,18),sq,true);

}
function spawnHive(){

function startWave(){

  R.sq=R.sq.filter(s=>R.en.some(e=>e.sq===s));

function onWaveClear(){
  for(const h of R.hives){h.alive++;if(h.alive>=3){h.alive=0;h.lvl++;h.max*=1.6;h.hp=Math.min(h.max,h.hp*1.6);toast('Hive evolved to Lv.'+h.lvl+' — spawns faster','#ff4d9a');}}

  startWave();
}

/* ================= COMBAT ================= */
function earn(v){v*=D.scrap*(boostOn()?2:1);S.money+=v;S.stats.earned+=v;R.incAcc+=v;return v}
function addNum(x,y,v,crit){if(R.nums.length>70)R.nums.shift();R.nums.push({x:x+rnd(-6,6),y,v,crit,life:crit?.9:.65,max:crit?.9:.65})}
function hit(t,dmg,crit,o){
  if(t.dead)return;o=o||{};
  if(t.boss||t.isHive)dmg*=D.boss;
  if(t.armor&&!o.pierce)dmg*=1-t.armor;
  t.hp-=dmg;t.flash=.07;
  if(o.cont){t.acc+=dmg;}else addNum(t.x,t.y-t.r-8,dmg,crit);
  if(crit&&!o.cont)sparks(t.x,t.y,4,'#ff5a5a');
  if(t.hp<=0){if(t.acc>0){addNum(t.x,t.y-t.r-8,t.acc,false);t.acc=0;}t.isHive?killHive(t):killEnemy(t);}
}
function rollCrit(){return Math.random()<D.crit}
function killEnemy(e){
  e.dead=true;
  if(R.focus===e)R.focus=null;
  let rw=rewScale(S.wave)*e.def.rew*(e.counted?1:.5);
  earn(rw);
  if(e.counted)R.wv.killed++;
  S.stats.kills++;
  const big=e.type==='brute'||e.boss;
  boom(e.x,e.y,big?2.2:1,e.type==='spitter'?'#8dff5a':e.type==='flyer'?'#c58bff':'#ffa62b');
  R.scorch.push({x:e.x,y:e.y,r:e.r*(big?1.6:1.1),a:.5});if(R.scorch.length>50)R.scorch.shift();
  for(let i=0;i<(big?5:1);i++)R.orbs.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-80,10),t:0});
  if(e.type==='brute'){S.stats.brutes++;if(Math.random()<.05)dropModule(0,e.x,e.y);if(Math.random()<.02)gainCache('Brute');}
  else if(e.boss){S.stats.queens++;const T=e.threat||1;const c=Math.round((6+D.prospect+Math.floor(S.wave/10))*T);if(T>=2.5)gainCache('Queen bonus');earn(rewScale(S.wave)*40*T);S.crystals+=c;gainCache('Queen');dropModule(1.5,e.x,e.y);toast('Queen destroyed  +'+c+' ◆','#ff4d9a');R.shake=14;noise(.18,.7);}
  else if(Math.random()<.002)dropModule(0,e.x,e.y);
  if(big)R.shake=Math.max(R.shake,6);
  if(Math.random()<.25)noise(.035,.18);
}
function killHive(h){
  h.dead=true;if(R.focus===h)R.focus=null;
  const c=3+Math.floor(S.wave/10)+D.prospect+(h.lvl-1);S.crystals+=c;
  earn(rewScale(S.wave)*30*h.lvl);S.stats.hives++;
  for(let i=0;i<4;i++)setTimeout(()=>boom(h.x+rnd(-20,20),h.y+rnd(-15,15),2,'#ff4d9a'),i*120);
  R.scorch.push({x:h.x,y:h.y,r:40,a:.7});
  dropModule(.8,h.x,h.y);gainCache('Hive');R.shake=12;noise(.2,.6);snd(220,.5,'sawtooth',.05,.3);
  toast('Hive destroyed  +'+c+' ◆','#ff4d9a');
}
function hurt(v){
  v*=D.taken;S.hull-=v;R.hurtT=.25;R.shake=Math.max(R.shake,3);

}
function breach(){
  R.en=[];R.ep=[];R.sq=[];R.focus=null;

}
function nearest(x,y,max,skip){let b=null,bd=max?max*max:1e12;for(const e of R.en){if(e.dead||e===skip)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e;}}return b}
function getTarget(range){
  const cx=MX,cy=MY-30;
  if(R.focus&&!R.focus.dead&&(!range||Math.hypot(R.focus.x-cx,R.focus.y-cy)<range))return R.focus;
  const e=nearest(cx,cy,range);if(e)return e;
  if(!range){const h=R.hives.find(h=>!h.dead);if(h)return h;}
  return null;
}
const MOUNT=[[12,17],[12,-17],[-6,-12],[-15,0],[6,9],[0,-2]];
const GLEN={bullet:15,missile:8,beam:13,chain:4,cone:11,rail:30,mortar:9};
function muzzle(i){const s=R.ws[i];const [mx,my]=MOUNT[i];const lx=mx+(s?GLEN[s.kind]:10),ly=my;const c=Math.cos(R.aim),sn=Math.sin(R.aim);return[MX+lx*c-ly*sn,MY-30+lx*sn+ly*c]}
function nearestN(x,y,n,max,excl){const arr=[];for(const e of R.en){if(e.dead||(excl&&excl.has(e)))continue;const d=(e.x-x)**2+(e.y-y)**2;if(max&&d>max*max)continue;arr.push([d,e]);}arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1])}
function threat(){return nearestN(MX,MY-12,1,115)[0]}
function toughest(){let t=null,b=-1;for(const e of R.en){if(!e.dead&&e.hp>b){b=e.hp;t=e;}}return t}
function rollHit(s){const c=Math.random()<D.crit+s.crit;return[c,c?D.critDmg+s.critMult:1]}
// central on-hit: damage + element + perk + leech
function strike(t,s,dmg,crit,o){
  if(!t||t.dead)return;o=o||{};
  if(t.boss||t.isHive)dmg*=s.bossM;if(R.od>0)dmg*=s.odM;
  hit(t,dmg,crit,o);

  const pc=o.cont?.3:1;
  if(s.perk==='storm'&&Math.random()<pc){const ns=nearestN(t.x,t.y,3,120,new Set([t]));if(ns.length){R.arcs.push({pts:[[t.x,t.y],...ns.map(e=>[e.x,e.y])],life:.12,col:s.col});for(const e of ns)hit(e,dmg*.5,false,{sec:true,cont:o.cont});}}
  if(s.perk==='nova'&&Math.random()<.18*pc){boom(t.x,t.y,.6,s.col);for(const e of [...R.en,...R.hives])if(!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<60+e.r)hit(e,dmg*.6,false,{sec:true});}
  if(s.perk==='split'&&!o.cont&&!o.shard){for(let k=0;k<4;k++){const a=k*TAU/4+Math.random();R.pr.push({k:'b',x:t.x,y:t.y,vx:Math.cos(a)*600,vy:Math.sin(a)*600,dmg:dmg*.4,crit:false,pierce:0,hits:new Set([t]),life:.25,s,shard:true,w:1});}}
  if(s.thunder&&!o.cont&&Math.random()<s.thunder){R.beams.push({x1:t.x,y1:-20,x2:t.x,y2:t.y,life:.2,max:.2,col:'#e6f6ff',w:4});for(const e of [...R.en,...R.hives])if(!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<55+e.r)hit(e,dmg*1.5,false,{sec:true});}
  if(s.leech&&R.leechT<=0){S.hull=Math.min(D.hull,S.hull+D.hull*.004);R.leechT=.08;}
}
function applyEl(t,s,dmg,cont){
  if(t.dead)return;const e=ELEM[s.el].id;const m=s.elM;
  if(e==='fire'){t.burn=3;t.burnD=Math.max(t.burnD||0,dmg*.35*m*(cont?.3:1));}
  else if(e==='ice'){t.slow=2*m;}
  else if(e==='shock'){if(Math.random()<(cont?.08:.3)*m){const ns=nearestN(t.x,t.y,2,110,new Set([t]));if(ns.length){R.arcs.push({pts:[[t.x,t.y],...ns.map(x=>[x.x,x.y])],life:.1,col:'#b48cff'});for(const x of ns)hit(x,dmg*.5,false,{sec:true});}}}
  else if(e==='poison'){t.pois=(t.pois||0)+dmg*.25*m*(cont?.3:1);}
  else if(e==='void'){if(!t.dead&&t.hp>0&&t.hp/t.max<((t.boss||t.isHive)?.06:.18)*Math.min(1.8,m)){const v=t.hp;t.hp=0;addNum(t.x,t.y-t.r-8,v,true);R.parts.push({x:t.x,y:t.y,vx:0,vy:0,life:.5,max:.5,col:'#c35bff',size:t.r*2,type:'ring'});t.isHive?killHive(t):killEnemy(t);}}
}
function fireW(s){
  const i=s.i;const [x,y]=muzzle(i);

    const lt=Math.hypot(t.x-x,t.y-y)/s.spd;const a0=Math.atan2(t.y+(t.vy||0)*lt-y,t.x+(t.vx||0)*lt-x);
    for(let k=0;k<s.pellets;k++){const off=s.pellets>1?(k/(s.pellets-1)-.5)*s.spread*2:0;const a=a0+off+rnd(-s.spread,s.spread)*.5;const [c,m]=rollHit(s);
      R.pr.push({k:'b',x,y,vx:Math.cos(a)*s.spd,vy:Math.sin(a)*s.spd,t,dmg:s.dmg*m,crit:c,pierce:s.pierce,hits:new Set(),life:(s.range||700)/s.spd,s,bounce:s.perk==='ricochet'?s.pierce+2:0,w:s.big?3:1.6});}
    R.parts.push({x,y,vx:0,vy:0,life:.05,max:.05,col:'#fff6c0',size:s.big?12:7,type:'flash'});
    if(Math.random()<.3)snd(s.big?220:rnd(700,900),s.big?.15:.04,'square',.012);return true;}
  if(s.kind==='missile'){const t0=getTarget();if(!t0)return false;
    for(let k=0;k<s.pellets;k++){const [c,m]=rollHit(s);const t=k===0?t0:(nearestN(t0.x+rnd(-60,60),t0.y+rnd(-60,60),1)[0]||t0);const a=R.aim+Math.PI+rnd(-1,1);
      R.pr.push({k:'m',x,y,t,tx:t.x,ty:t.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160-60,dmg:s.dmg*m,crit:c,life:3,spd:s.spd,trail:0,s});}
    snd(160,.25,'sawtooth',.025,2);return true;}
  if(s.kind==='mortar'){const t0=getTarget();if(!t0)return false;
    for(let k=0;k<s.pellets;k++){const t=k===0?t0:(nearestN(t0.x+rnd(-80,80),t0.y+rnd(-80,80),1)[0]||t0);const [c,m]=rollHit(s);
      R.pr.push({k:'o',x,y,sx:x,sy:y,tx:t.x+(t.vx||0)*.8,ty:t.y+(t.vy||0)*.8,f:0,dur:.9,dmg:s.dmg*m,crit:c,life:2,s});}
    snd(120,.2,'sine',.04,1.8);return true;}
  if(s.kind==='beam'){let ts=[];const f=getTarget();if(f)ts.push(f);ts=ts.concat(nearestN(MX,MY-30,s.pellets+1,0,new Set(ts))).slice(0,s.pellets);if(!ts.length){return false;}
    R.beamDraw[i]={ts,life:.12,col:s.col,w:1+s.dmgM*.3};
    for(const t of ts){const [c,m]=rollHit(s);strike(t,s,s.dmg*m,c,{cont:true});}
    return true;}
  if(s.kind==='chain'){const starts=[];const f=getTarget();if(!f)return false;starts.push(f);for(const e of nearestN(f.x,f.y,s.pellets-1,200,new Set([f])))starts.push(e);
    for(const st of starts){let t=st,d=s.dmg;const pts=[[x,y-4]],hs=new Set();
      for(let k=0;k<s.chains&&t;k++){pts.push([t.x,t.y]);hs.add(t);const [c,m]=rollHit(s);strike(t,s,d*m,c);d*=.82;t=nearestN(t.x,t.y,1,150,hs)[0];}
      R.arcs.push({pts,life:.14,col:s.col});}
    snd(rnd(1200,1800),.06,'sawtooth',.012,.5);return true;}
  if(s.kind==='cone'){const t=getTarget(s.range);if(!t)return false;const a=Math.atan2(t.y-y,t.x-x);const half=.38*(1+.3*(s.pellets-1));
    R.flameDraw[i]=.12;
    for(let k=0;k<3;k++){const aa=a+rnd(-half*.75,half*.75),sp=rnd(260,360)*(s.range/210);R.parts.push({x,y,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,life:.55,max:.55,col:s.col,size:rnd(5,9),type:'fire'});}
    for(const e of [...R.en,...R.hives]){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);if(d>s.range+e.r)continue;let da=Math.abs(Math.atan2(dy,dx)-a);if(da>Math.PI)da=TAU-da;if(da<half){const [c,m]=rollHit(s);strike(e,s,s.dmg*m,c,{cont:true});}}
    return true;}
  if(s.kind==='rail'){const list=[];const f=R.focus&&!R.focus.dead?R.focus:threat()||toughest()||getTarget();if(!f)return false;list.push(f);for(const e of nearestN(f.x,f.y,s.pellets-1,250,new Set([f])))list.push(e);
    for(const t of list){const a=Math.atan2(t.y-y,t.x-x),c=Math.cos(a),sn=Math.sin(a);const [cr,m]=rollHit(s);
      for(const e of [...R.en,...R.hives]){if(e.dead)continue;const px=e.x-x,py=e.y-y,pr=px*c+py*sn;if(pr<0)continue;if(Math.abs(-px*sn+py*c)<e.r+8)strike(e,s,s.dmg*m,cr,{pierce:true});}
      R.beams.push({x1:x,y1:y,x2:x+c*900,y2:y+sn*900,life:.28,max:.28,col:s.col,w:6});}

}
function explode(px,py,s,dmg,crit,r){boom(px,py,r>60?1.1:.7,s.col);for(const e of [...R.en,...R.hives]){if(!e.dead&&Math.hypot(e.x-px,e.y-py)<r+e.r)strike(e,s,dmg,crit);}R.shake=Math.max(R.shake,2.5);}

function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rnd(60,180);R.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.25,max:.25,col,size:2,type:'spark'});}}

/* ================= MODULES ================= */
function rollRarity(bonus){
  const luck=bonus+S.wave/120;const w=[60,25,10,4,1].map((x,i)=>x*Math.pow(1+luck,i));
  let sum=w.reduce((a,b)=>a+b,0),r=Math.random()*sum;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return 0;
}
function dropModule(bonus,x,y){
  const type=MK[Math.floor(Math.random()*MK.length)];let rar=rollRarity(bonus);
  if(bonus>=1.5&&Math.random()<.15)rar=5;
  addModule(type,rar);
  const m=MODS[type];toast(`${RAR[rar][0]} ${m.name} module found (+${m.v[rar]}% ${m.lbl})`,RAR[rar][1]);
  if(x!=null)R.parts.push({x,y,vx:0,vy:-30,life:1.2,max:1.2,col:RAR[rar][1],size:30,type:'ring'});
  snd(880,.15,'triangle',.04,1.5);
}
function addModule(type,rar){
  const inv=S.modules.filter(m=>!S.equipped.includes(m.id));
  if(inv.length>=40){const worst=inv.sort((a,b)=>a.rar-b.rar)[0];if(worst.rar<=rar){S.modules=S.modules.filter(m=>m!==worst);earn(rewScale(S.wave)*5*(worst.rar+1));}else{earn(rewScale(S.wave)*5*(rar+1));return;}}
  S.modules.push({id:S.nextId++,type,rar});
}
function autoFuse(){
  let n=0;
  for(let rar=0;rar<5;rar++)for(const type of MK){
    let list=S.modules.filter(m=>m.type===type&&m.rar===rar&&!S.equipped.includes(m.id));
    while(list.length>=3){const rm=list.splice(0,3);S.modules=S.modules.filter(m=>!rm.includes(m));S.modules.push({id:S.nextId++,type,rar:rar+1});n++;}
  }
  S.stats.fused+=n;return n;
}

/* ================= UPDATE ================= */
function update(dt){
  R.time+=dt;S.stats.time+=dt;R.sndN=0;
  const wv=R.wv;
  // spawning
  if(!wv.done){
    wv.squadT-=dt;
    const normalTotal=wv.boss?wv.total-1:wv.total;
    if(wv.squadT<=0&&wv.spawned<normalTotal&&R.en.length<70){
      const n=Math.min(normalTotal-wv.spawned,3+Math.floor(Math.random()*6));spawnSquad(n);
      wv.squadT=Math.max(.9,2.3-S.wave*.02)+rnd(0,.6);
    }
    if(wv.boss&&!wv.bossSpawned&&wv.spawned>=normalTotal&&R.en.filter(e=>e.counted).length<6){
      wv.bossSpawned=true;const T=bossThreat();const nq=T>=3.5?2:1;
      for(let k=0;k<nq;k++){const q=mkEnemy('queen',VW*(.85-k*.25),-40-k*30,null,true);q.threat=T;q.hp*=T;q.max=q.hp;q.armor=T>=1.5?.3:0;q.dmgM=Math.sqrt(T);q.volleyT=4;R.en.push(q);if(k)wv.total++;}
      wv.spawned++;banner(nq>1?'TWIN QUEENS  ×'+T.toFixed(1):'HIVE QUEEN  ×'+T.toFixed(1),'#ff4d9a');noise(.15,.8);
    }
    if(wv.killed>=wv.total){wv.done=true;R.clearT=1.6;banner('WAVE '+S.wave+' CLEARED','#5dff9b');snd(520,.12,'triangle',.05,1.5);}
  }else{R.clearT-=dt;if(R.clearT<=0)onWaveClear();}
  // hives

function drawShadow(x,y,rx,ry){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill()}
function legs(n,r,t,moving,col,spread){
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.6,r*.16);ctx.lineCap='round';
  for(const s of [-1,1])for(let i=0;i<n;i++){

    const bx=-f*r*.35,by=s*r*.35;const kx=bx+(-f*.5+ph)*r*.7,ky=s*r*1.05*spread,fx=bx+(-f*.9+ph*1.4)*r*.8,fy=s*r*1.45*spread;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(kx,ky);ctx.lineTo(fx,fy);ctx.stroke();}
}
function drawEnemy(e){

function drawGuns(low){

  ctx.setTransform(sc,0,0,sc,0,0);

  if(floorCv){ctx.save();ctx.setTransform(1,0,0,1,0,0);if(R.shake>0)ctx.translate(rnd(-R.shake,R.shake)*sc*.5,rnd(-R.shake,R.shake)*sc*.5);ctx.drawImage(floorCv,0,0);ctx.restore();}
  for(const s of R.scorch){const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);g.addColorStop(0,`rgba(8,8,10,${s.a})`);g.addColorStop(1,'rgba(8,8,10,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}

  const actors=R.en.filter(e=>!e.def.fly).map(e=>[e.y,e]);actors.push([MY,null]);actors.sort((a,b)=>a[0]-b[0]);
  for(const [,e] of actors){if(e)drawEnemy(e);else drawMech();}
  // beams & flames
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){const b=R.beamDraw[i];if(!b)continue;const [x,y]=muzzle(i);
    for(const t of b.ts){if(t.dead)continue;for(const [w,a] of [[8,.15],[4,.4],[1.6,1]]){ctx.strokeStyle=b.col;ctx.globalAlpha=a;ctx.lineWidth=w*b.w*(R.od>0?1.3:1);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(t.x,t.y);ctx.stroke();}
      ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x,t.y,3,0,TAU);ctx.fill();}}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  for(const e of R.en)if(e.def.fly)drawEnemy(e);
  // drones
  for(const d of R.drones){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(d.x,d.y+14,5,2,0,0,TAU);ctx.fill();ctx.fillStyle='#9aa7b3';ctx.fillRect(d.x-4,d.y-3,8,6);ctx.fillStyle='#3fe0ff';ctx.fillRect(d.x-1.5,d.y-1.5,3,3);ctx.strokeStyle='rgba(200,220,235,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(d.x-7,d.y-4);ctx.lineTo(d.x+7,d.y-4);ctx.stroke();}
  // projectiles
  ctx.globalCompositeOperation='lighter';
  for(const p of R.pr){const c=p.s.col;
    if(p.k==='b'){const px=p.px??p.x,py=p.py??p.y;const dx=p.x-px,dy=p.y-py,d=Math.hypot(dx,dy)||1;ctx.strokeStyle=p.crit?'#ff7a6a':'#fff1c4';ctx.lineWidth=(p.w||1.6)*(p.crit?1.4:1);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-dx/d*14,p.y-dy/d*14);ctx.stroke();ctx.strokeStyle=c;ctx.globalAlpha=.6;ctx.lineWidth=(p.w||1.6)*2.2;ctx.beginPath();ctx.moveTo(p.x-dx/d*4,p.y-dy/d*4);ctx.lineTo(p.x-dx/d*12,p.y-dy/d*12);ctx.stroke();ctx.globalAlpha=1;}
    else{const r=p.k==='o'?6:4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,r*.6,0,TAU);ctx.fill();ctx.fillStyle=c;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(p.x,p.y,r*1.8,0,TAU);ctx.fill();ctx.globalAlpha=1;
      if(p.k==='o'){ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(p.gx,p.gy,5,2,0,0,TAU);ctx.fill();ctx.globalCompositeOperation='lighter';}}
  }
  for(const p of R.ep){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,7);g.addColorStop(0,'rgba(200,255,120,1)');g.addColorStop(1,'rgba(100,255,60,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,7,0,TAU);ctx.fill();}
  for(const a of R.arcs){for(const [w,al] of [[5,.2],[1.8,1]]){ctx.strokeStyle=a.col||'#7fd8ff';ctx.globalAlpha=Math.min(1,al*a.life/.12);ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.pts[0][0],a.pts[0][1]);
  ctx.globalAlpha=1;
    for(let i=1;i<a.pts.length;i++){const [x0,y0]=a.pts[i-1],[x1,y1]=a.pts[i];for(let k=1;k<=4;k++){const f=k/4;ctx.lineTo(x0+(x1-x0)*f+(k<4?rnd(-7,7):0),y0+(y1-y0)*f+(k<4?rnd(-7,7):0));}}ctx.stroke();}}

function tabMech(){
  let h=`<div class="row between" style="margin-bottom:9px"><div class="h" style="margin:0">Total DPS <b class="mono">${fmt(totalDps())}</b></div><div class="seg">${[1,10,25,'MAX'].map(m=>`<button data-act="buymode" data-v="${m}" class="${S.buyMode==m?'on':''}">${m==='MAX'?'MAX':'x'+m}</button>`).join('')}</div></div>`;
  h+=`<div class="row between" style="margin-bottom:9px;gap:8px"><button class="btn" data-act="codex" style="flex:1">📖 Codex ${S.found.length}/${fmt(POOL)}</button>${S.caches?`<button class="btn o" data-act="opencache" style="flex:1">▣ Open Weapon Cache ×${S.caches}</button>`:`<span class="note" style="flex:1">Queens & Hives drop Weapon Caches</span>`}</div>`;
  let shownLock=false;
  for(let i=0;i<6;i++){
    if(S.hp[i])h+=hpCard(i);
    else if(!shownLock){shownLock=true;h+=`<button class="unlock" data-act="unlock" data-k="${i}" data-cost="${HPT[i].unlock}">Unlock Hardpoint ${i+1}  ${fmt(HPT[i].unlock)} $<small>Then choose 1 of 2 weapons · max rarity ${WRAR[rarCap()][0]}</small></button>`;}
    else h+=`<div class="card locked">◼ HARDPOINT ${i+1} LOCKED ◼</div>`;
  }
  h+=`<div class="note" style="margin-top:6px"><b style="color:#ffa62b">Income bonus ×${D.upInc.toFixed(2)}</b>: every weapon level adds +1% scrap and every tree upgrade +2%. Boss threat <b style="color:#ff4d9a">×${bossThreat().toFixed(1)}</b> (stronger weapons = stronger Queens & Hives, bigger rewards). Weapon rarity now reaches <b style="color:${WRAR[rarCap()][1]}">${WRAR[rarCap()][0]}</b>; each Reboot unlocks a higher rarity and better odds. Levels belong to the hardpoint: swap in a new weapon and it keeps the level. Every 25 levels doubles damage. Tap a weapon for its full stats. Tap an enemy or Hive to focus fire.</div>`;
  return h;
}
function tabTree(){
  let h=`<div class="h">Upgrade Tree — each node needs its parent first</div>`;
  const depth=n=>n.p?1+depth(TR[n.p]):0;
  const order=[];const add=p=>{for(const n of TREE)if(n.p===p){order.push(n);add(n.id);}};add(null);
  for(const n of order){const d=depth(n),l=lvl(n.id),locked=n.p&&!lvl(n.p),maxed=l>=n.max,cost=treeCost(n);
    h+=`<div class="card node tree-d${d} ${locked?'nlock':''}">${d?'<i class="branch"></i>':''}<div class="nm"><b>${n.name} <span class="lv">${l}/${n.max}</span></b><small>${locked?'Requires '+TR[n.p].name:n.desc}</small></div>
    ${maxed?'<button class="buy max">MAXED</button>':locked?'<button class="buy dis">LOCKED</button>':`<button class="buy" data-act="tree" data-k="${n.id}" data-cost="${cost}"><small>LV ${l+1} · +2% $</small><b>${fmt(cost)} <em>$</em></b></button>`}</div>`;}
  return h;
}
function modTile(m,act){const M=MODS[m.type],c=RAR[m.rar][1];return `<button class="mod" data-act="${act}" data-id="${m.id}" style="border-color:${c};color:${c};box-shadow:inset 0 0 12px ${c}22"><span class="mi">${M.ic}</span>+${M.v[m.rar]}%<br>${M.lbl}</button>`}
function tabArmory(){
  let h=`<div class="h">Equipped modules (${S.equipped.filter(Boolean).length}/${S.slots}) — tap to remove</div><div class="mgrid" style="grid-template-columns:repeat(${Math.min(6,S.slots)},1fr);margin-bottom:10px">`;
  for(let i=0;i<S.slots;i++){const m=S.equipped[i]?modById(S.equipped[i]):null;h+=m?modTile(m,'unequip'):'<div class="mod empty">EMPTY</div>';}
  h+='</div>';
  const bon=MK.map(k=>{const v=modSum(k);return v?`+${+v.toFixed(1)}% ${MODS[k].lbl}`:''}).filter(Boolean).join(' · ')||'No bonuses yet';
  h+=`<div class="note" style="margin-bottom:10px">${bon}</div>`;
  const inv=S.modules.filter(m=>!S.equipped.includes(m.id)).sort((a,b)=>b.rar-a.rar||a.type.localeCompare(b.type));
  h+=`<div class="row" style="gap:8px;margin-bottom:10px"><button class="btn" data-act="fuse">⚙ Auto-Fuse (3 → 1 higher)</button><button class="btn o" data-act="salvage">Salvage Commons</button></div>`;
  h+=`<div class="h">Inventory (${inv.length}/40) — tap to equip</div>`;
  if(!inv.length)h+='<div class="note">Modules drop from Brutes, Hives and Queens. Fuse three identical modules into the next rarity: Common → Uncommon → Rare → Epic → Legendary → Unique.</div>';
  else{h+='<div class="mgrid">';for(const m of inv)h+=modTile(m,'equip');h+='</div>';}
  return h;
}
function tabShop(){
  let h=`<div class="h">Crystal Shop — you have <b>${S.crystals} ◆</b></div>`;
  for(const it of SHOP){const done=it.done&&it.done();const c=it.cost();
    h+=`<div class="card wcard"><div class="wmid"><div class="wname">${it.name}</div><div class="note">${it.desc}</div></div>${done?'<button class="buy max">OWNED</button>':`<button class="buy" data-act="shop" data-k="${it.id}" data-cost="${c}" data-cur="c"><small>BUY</small><b>${c} <em style="color:#3fe0ff">◆</em></b></button>`}</div>`;}
  h+=`<div class="note">Earn ◆ by destroying Hives and Queens, completing missions (clipboard, top-left) and clearing every 10th wave for the first time.</div>`;
  return h;
}
function tabReboot(){
  const g=coresGain();
  let h=`<div class="card"><div class="wname">Core Reboot</div><div class="note" style="margin:6px 0 10px">Restart from Wave 1 to install Reactor Cores. Each Core gives <b style="color:#3fe0ff">+15% damage and scrap</b>, permanently. Hardpoint levels, extra hardpoints, money and the upgrade tree reset (Hardpoint 1 keeps its weapon). Modules, crystals, caches, the codex and abilities stay. Enemies get 4% tougher per reboot.</div>
  <div class="stat"><span>Cores installed</span><b>${S.cores}  (+${S.cores*15}%)</b></div>
  <div class="stat"><span>Highest wave this run</span><b>${S.maxWaveRun}</b></div>
  <div class="stat"><span>Cores if you reboot now</span><b>+${g}</b></div>
  <button class="unlock ${g>0?'':'dis'}" style="margin:12px 0 0" data-act="reboot">${g>0?'REBOOT  +'+g+' CORES':'Reach Wave 25 to reboot'}</button></div>`;
  h+=`<div class="h">Lifetime</div><div class="card">${statsHtml()}</div>`;
  return h;
}
function statsHtml(){const s=S.stats;return [['Best wave',S.bestWave],['Reboots',S.prestiges],['Enemies destroyed',fmt(s.kills)],['Brutes',fmt(s.brutes)],['Hives destroyed',s.hives],['Queens slain',s.queens],['Modules fused',s.fused],['Scrap earned',fmt(s.earned)],['Time played',Math.floor(s.time/3600)+'h '+Math.floor(s.time%3600/60)+'m']].map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')}

/* missions */
function misProg(m){const t=MT.find(x=>x.k===m.k);return t.abs?S.maxWaveRun:S.stats[t.stat]-m.base}
function mkMission(){
  const have=S.missions.map(m=>m.k);const pool=MT.filter(t=>!have.includes(t.k)&&(!t.minWave||S.bestWave>=t.minWave));
  const t=pool[Math.floor(Math.random()*pool.length)]||MT[0];const goal=t.n(S.missionsDone);
  return{k:t.k,goal,base:t.abs?0:S.stats[t.stat],rew:5+Math.floor(S.missionsDone/3)};
}
function fillMissions(){while(S.missions.length<3)S.missions.push(mkMission())}
function showMissions(){
  let h=`<button class="x" data-act="close">✕</button><h2>Missions</h2>`;
  for(const m of S.missions){const t=MT.find(x=>x.k===m.k),p=Math.min(m.goal,Math.max(0,misProg(m))),done=p>=m.goal;
    h+=`<div class="card mis"><div class="nm">${t.txt(m.goal)}<div class="note">${fmt(p)} / ${fmt(m.goal)}</div><div class="pb"><i style="width:${p/m.goal*100}%"></i></div></div>${done?`<button class="buy" data-act="claim" data-k="${m.k}"><small>CLAIM</small><b>${m.rew} <em style="color:#3fe0ff">◆</em></b></button>`:`<button class="buy dis"><small>REWARD</small><b>${m.rew} ◆</b></button>`}</div>`;}
  h+=`<div class="note">Completed missions are replaced with harder ones that pay more.</div>`;
  openModal(h,'missions');
}
let modalKind=null;
function openModal(h,kind){$('#mbox').innerHTML=h;$('#modal').classList.add('on');modalKind=kind||null}
function closeModal(){$('#modal').classList.remove('on');modalKind=null}
function showSettings(){
  openModal(`<button class="x" data-act="close">✕</button><h2>Settings</h2>
  <div class="row between card"><span>Sound</span><button class="btn" data-act="sound">${S.sound?'ON':'OFF'}</button></div>
  <div class="card">${statsHtml()}</div>
  <div class="note" style="margin:8px 0">Progress saves automatically on this device. While you're away you earn ${Math.round(D.offline*100)}% of your scrap rate (up to 8 hours).</div>
  <div class="row" style="gap:8px"><button class="btn" data-act="restart">⟳ Restart game</button><button class="btn o" data-act="reset1">Reset all progress</button></div><div class="note" style="margin-top:10px">Build ${BUILD}</div>`,'settings');
}

/* actions */
document.addEventListener('click',ev=>{
  initAudio();
  const nb=ev.target.closest('#nav button');
  if(nb){tab=nb.dataset.tab;for(const b of document.querySelectorAll('#nav button'))b.classList.toggle('on',b===nb);$('#panel').scrollTop=0;renderPanel();snd(600,.05,'square',.02);return;}
  if(ev.target.id==='modal'){if(modalKind!=='draft')closeModal();return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,k=b.dataset.k;
  switch(a){
    case 'buymode':S.buyMode=b.dataset.v==='MAX'?'MAX':+b.dataset.v;renderPanel();break;
    case 'buyw':{const i=+k;const {n,cost}=buyInfo(i);if(S.money>=cost){S.money-=cost;S.hp[i].lvl+=n;recalc();snd(900,.06,'square',.03,1.4);renderPanel();}break;}
    case 'unlock':{const i=+k;if(S.money>=HPT[i].unlock&&!S.hp[i]){S.money-=HPT[i].unlock;S.hp[i]={lvl:1,w:null};newDraft('unlock',i,0);}break;}
    case 'draft':{const i=+k;if(S.hp[i]&&!S.hp[i].w)newDraft('unlock',i,0);break;}
    case 'pick':pickDraft(+k);break;
    case 'install':{const w=R.draft&&R.draft.picked;if(w){const i=+k;S.hp[i].w=w;S.caches=Math.max(0,S.caches-1);finishDraft(w,i);}break;}
    case 'scrapcache':{if(R.draft){S.caches=Math.max(0,S.caches-1);S.crystals+=3;R.draft=null;R.paused=false;closeModal();renderPanel();toast('Cache scrapped +3 ◆','#3fe0ff');}break;}
    case 'reroll':{if(R.draft&&!R.draft.picked&&S.crystals>=5){S.crystals-=5;const d=R.draft;newDraft(d.mode,d.slot,d.bonus);}break;}
    case 'opencache':{if(S.caches>0)newDraft('cache',null,.2);break;}
    case 'winfo':showWInfo(+k);break;
    case 'codex':showCodex();break;
    case 'tree':{const n=TR[k],c=treeCost(n);if(S.money>=c&&lvl(k)<n.max&&(!n.p||lvl(n.p))){S.money-=c;S.tree[k]=lvl(k)+1;recalc();snd(700,.08,'triangle',.04,1.5);renderPanel();}break;}
    case 'equip':{const id=+b.dataset.id;const i=S.equipped.indexOf(null);if(i<0){toast('All slots full — tap an equipped module to remove it');break;}S.equipped[i]=id;recalc();renderPanel();snd(800,.06,'triangle',.03);break;}
    case 'unequip':{const id=+b.dataset.id;const i=S.equipped.indexOf(id);if(i>=0)S.equipped[i]=null;recalc();renderPanel();break;}
    case 'fuse':{const n=autoFuse();toast(n?`Fused ${n} module${n>1?'s':''}`:'Need 3 identical modules (same type and rarity)',n?'#5dff9b':null);if(n)snd(500,.3,'triangle',.05,2);renderPanel();break;}
    case 'salvage':{const c=S.modules.filter(m=>m.rar===0&&!S.equipped.includes(m.id));if(c.length){S.modules=S.modules.filter(m=>!c.includes(m));const v=earn(rewScale(S.wave)*5*c.length);toast(`Salvaged ${c.length} for $${fmt(v)}`,'#ffa62b');}renderPanel();break;}
    case 'shop':{const it=SHOP.find(x=>x.id===k),c=it.cost();if(S.crystals<c||(it.done&&it.done()))break;S.crystals-=c;
      if(k==='orbital'||k==='repair'){S.abilities[k]=true;toast((k==='orbital'?'Orbital Strike':'Field Repair')+' unlocked','#3fe0ff');}
      else if(k==='slot'){S.slots++;S.equipped.push(null);}
      else if(k==='crate')dropModule(1);
      else if(k==='cache'){S.caches++;newDraft('cache',null,.2);}
      else if(k==='warp'){const v=earn(Math.max(S.avgIncome,rewScale(S.wave)*3)*3600/((D.scrap)*(boostOn()?2:1)));toast('Time Warp: +$'+fmt(v),'#ffa62b');}
      snd(1000,.15,'triangle',.04,1.5);renderPanel();break;}
    case 'reboot':{const g=coresGain();if(!g)break;openModal(`<h2>Reboot?</h2><p class="note">You'll install <b style="color:#3fe0ff">+${g} Cores</b> (total ${S.cores+g}, +${(S.cores+g)*15}% damage & scrap) and restart at Wave 1. Weapons, money and the tree reset.</p><div class="row" style="gap:10px;margin-top:12px"><button class="btn o" data-act="reboot2">REBOOT</button><button class="btn" data-act="close">Cancel</button></div>`);break;}
    case 'reboot2':doReboot();closeModal();break;
    case 'missions':fillMissions();showMissions();break;
    case 'claim':{const i=S.missions.findIndex(m=>m.k===k);const m=S.missions[i];if(m&&misProg(m)>=m.goal){S.crystals+=m.rew;S.missionsDone++;S.missions.splice(i,1);S.missions.push(mkMission());snd(1200,.2,'triangle',.05,1.3);toast('+'+m.rew+' ◆','#3fe0ff');showMissions();}break;}
    case 'settings':showSettings();break;
    case 'sound':S.sound=!S.sound;showSettings();break;
    case 'reset1':openModal(`<h2>Reset everything?</h2><p class="note">This deletes all progress, cores, modules and crystals.</p><div class="row" style="gap:10px;margin-top:12px"><button class="btn o" data-act="reset2">Delete save</button><button class="btn" data-act="close">Cancel</button></div>`);break;
    case 'reset2':noSave=true;try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload();break;
    case 'restart':save();location.reload();break;
    case 'speed':S.speed=S.speed===2?1:2;toast(S.speed===2?'Game speed 2×':'Game speed 1×','#3fe0ff');break;
    case 'close':closeModal();break;
    case 'farm':S.farm=!S.farm;toast(S.farm?'Farm mode: repeating Wave '+S.wave:'Auto-advance ON');break;
    case 'boost':{const now=Date.now();if(now<S.boostCd){toast('Boost recharging');break;}S.boostEnd=Math.min(Math.max(now,S.boostEnd)+5*60e3,now+30*60e3);S.boostCd=now+3*60e3;toast('Scrap x2 boost +5 min','#ffa62b');snd(700,.25,'triangle',.05,2);break;}
    case 'ab':useAbility(k);break;
  }
  hud();
});
const rarCap=()=>Math.min(5,2+S.prestiges);
function rollWRar(bonus){
  const cap=rarCap(),luck=.25*S.prestiges+bonus;const w=[60,28,10,4,1.5,.5].slice(0,cap+1).map((x,i)=>x*Math.pow(1+luck,i));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return 0;
}
function rollWeapon(bonus,avoidBase,starter){
  let id=0;for(let t=0;t<40;t++){id=Math.floor(Math.random()*POOL);const bb=Math.floor(id%1000/100);if(avoidBase!=null&&bb===avoidBase)continue;if(starter&&(bb===3||bb===8||bb===2))continue;if(!S.found.includes(id)||t>5)break;}
  return{id,rar:rollWRar(bonus)};
}
function newDraft(mode,slot,bonus){const st=mode==='unlock'&&slot===0&&!S.hp.some((h,i)=>i>0&&h);const a=rollWeapon(bonus,null,st);const b=rollWeapon(bonus,Math.floor(a.id%1000/100),st);R.draft={mode,slot,bonus,opts:[a,b]};R.paused=true;showDraft();}
function statLines(w,i){
  const save=S.hp[i];S.hp[i]={lvl:save?save.lvl:1,w};const st=wStats(i);S.hp[i]=save;
  const b=wb(w.id),L=[];
  L.push(`<b>DPS ${fmt(st.dps*D.dmg*D.rate)}</b> at HP${i+1} Lv.${save?save.lvl:1}`);
  L.push(`${st.kind==='beam'||st.kind==='cone'?'Ticks':'Fire rate'} ${st.rate.toFixed(2)}/s`+(st.pellets>1?` · ${st.pellets} ${st.kind==='beam'?'beams':st.kind==='rail'?'rails':st.kind==='chain'?'chains':st.kind==='cone'?'width':'projectiles'}`:''));
  const ex=[];if(st.pierce)ex.push('Pierce '+st.pierce);if(st.chains)ex.push(st.chains+' jumps');if(st.aoe)ex.push('Blast '+Math.round(st.aoe));if(st.range)ex.push('Range '+Math.round(st.range));if(st.homing)ex.push('Homing');if(st.crit)ex.push('+'+Math.round(st.crit*100)+'% crit');if(st.critMult)ex.push('+'+Math.round(st.critMult*100)+'% crit dmg');
  if(ex.length)L.push(ex.join(' · '));
  return `<div class="wl">${b.desc}</div><div class="wl" style="color:#ffd27a">${wp(w.id)[0]}: ${wp(w.id)[1]}</div><div class="wl" style="color:${we(w.id).col}">${we(w.id).desc}</div>${wsx(w.id)[0]?`<div class="wl" style="color:#9fe6ff">${wsx(w.id)[0]}: ${wsx(w.id)[1]}</div>`:''}<div class="wl stats">${L.join('<br>')}</div>`;
}
function wCardHtml(w,i,k){const rc=WRAR[w.rar][1],isNew=!S.found.includes(w.id);
  return `<div class="dcard" style="border-color:${rc};box-shadow:0 0 16px ${rc}33"><div class="row between"><span class="wtag">${wNo(w.id)}</span>${isNew?'<span class="newb">NEW</span>':'<span class="wtag">owned</span>'}</div>
  <div class="dico">${icOf(w.id)}<i class="edot" style="background:${we(w.id).col}"></i></div>
  <div class="wname" style="color:${rc};white-space:normal">${wName(w.id)}</div><div class="wtag" style="color:${rc}">${WRAR[w.rar][0]}</div>${statLines(w,i)}
  <button class="unlock" style="margin:8px 0 0;padding:10px;font-size:15px" data-act="pick" data-k="${k}">TAKE</button></div>`}
function showDraft(){
  const d=R.draft;if(!d)return;
  const slot=d.mode==='cache'?(d.slot??S.hp.findIndex(h=>h&&h.w)):d.slot;const i=Math.max(0,slot);
  const title=d.mode==='cache'?'Weapon Cache':'Hardpoint '+(d.slot+1)+' online';
  openModal(`<h2>${title}</h2><div class="note" style="margin-bottom:8px">Choose 1 of 2 · Codex ${S.found.length}/${fmt(POOL)}</div><div class="dgrid">${d.opts.map((w,k)=>wCardHtml(w,i,k)).join('')}</div>
  <div class="row" style="gap:8px;margin-top:10px"><button class="btn" data-act="reroll" data-cost="5" data-cur="c">⟳ Reroll both · 5 ◆</button>${d.mode==='cache'?'<button class="btn o" data-act="scrapcache">Scrap for 3 ◆</button>':''}</div>`,'draft');
}
function pickDraft(k){
  const d=R.draft;if(!d)return;const w=d.opts[k];
  if(!S.found.includes(w.id))S.found.push(w.id);
  if(d.mode==='cache'){R.draft.picked=w;showSlotPick();return;}
  S.hp[d.slot].w=w;finishDraft(w,d.slot);
}
function showSlotPick(){
  const w=R.draft.picked;let h=`<h2>Install ${wName(w.id)}</h2><div class="note" style="margin-bottom:8px">Pick a hardpoint. The new weapon keeps that hardpoint's level.</div>`;
  for(let i=0;i<6;i++){const hp=S.hp[i];if(!hp)continue;const save=hp.w;hp.w=w;const nd=wStats(i).dps;hp.w=save;const od=save?wStats(i).dps:0;const up=nd>=od;
    h+=`<div class="card wcard"><div class="wmid"><div class="wtag">HP${i+1} · Lv.${hp.lvl}</div><div class="wname" style="font-size:14px;color:${save?WRAR[save.rar][1]:'#7f93a6'}">${save?wName(save.id):'Empty'}</div><div class="wsub"><span>${fmt(od*D.dmg*D.rate)} → <b style="color:${up?'#5dff9b':'#ff4d5e'}">${fmt(nd*D.dmg*D.rate)}</b> DPS</span></div></div><button class="buy" data-act="install" data-k="${i}"><small>${up?'▲ UPGRADE':'▼ SWAP'}</small><b>INSTALL</b></button></div>`;}
  h+=`<button class="btn o" data-act="scrapcache">Keep current weapons · scrap for 3 ◆</button>`;
  openModal(h,'draft');
}
function finishDraft(w,i){S.stats.drafts=(S.stats.drafts||0)+1;R.draft=null;R.paused=false;closeModal();recalc();renderPanel();
  toast(`${wName(w.id)} installed on HP${i+1}`,WRAR[w.rar][1]);snd(400,.3,'sawtooth',.04,2);}
function gainCache(src){S.caches++;toast('▣ Weapon Cache from '+src+' — open it in the Mech tab','#ffa62b');}
function showWInfo(i){const h=S.hp[i];if(!h||!h.w)return;const w=h.w;
  openModal(`<button class="x" data-act="close">✕</button><div class="row" style="gap:10px;margin-bottom:6px"><div class="dico" style="margin:0">${icOf(w.id)}<i class="edot" style="background:${we(w.id).col}"></i></div><div><div class="wname" style="color:${WRAR[w.rar][1]};white-space:normal">${wName(w.id)}</div><div class="wtag">${wNo(w.id)} · ${WRAR[w.rar][0]} · Hardpoint ${i+1}</div></div></div>${statLines(w,i)}`,'info');}
function showCodex(){
  let h=`<button class="x" data-act="close">✕</button><h2>Weapon Codex</h2><div class="note" style="margin-bottom:10px">${S.found.length} of 12,000 weapons discovered. A weapon counts once you take it from a draft. 10 bases × 20 prefixes × 5 elements × 12 suffixes.</div>`;
  BASES.forEach((b,bi)=>{const n=S.found.filter(id=>Math.floor(id%1000/100)===bi).length;h+=`<div class="stat"><span>${b.name}</span><b>${n}/1,200</b></div><div class="pbar" style="margin:0 0 6px"><i style="width:${n/12}%;background:var(--cyan)"></i></div>`;});
  h+=`<div class="h" style="margin-top:10px">Prefixes</div><div class="note">${PREFIX.map(p=>`<b style="color:#ffd27a">${p[0]}</b> ${p[1]}`).join(' · ')}</div><div class="h" style="margin-top:10px">Suffixes</div><div class="note">${SUFFIX.slice(1).map(x=>`<b style="color:#9fe6ff">${x[0]}</b> ${x[1]}`).join(' · ')}</div><div class="h" style="margin-top:10px">Elements</div><div class="note">${ELEM.map(e=>`<span style="color:${e.col}">${e.desc}</span>`).join('<br>')}</div>`;
  openModal(h,'codex');
}
function useAbility(k){
  if(!S.abilities[k]){toast('Unlock in the Shop with ◆');return;}
  if(R.cd[k]>0)return;
  if(k==='overdrive'){R.od=ABIL.overdrive.dur;banner('OVERDRIVE','#ffa62b');snd(300,.4,'sawtooth',.05,3);}
  else if(k==='orbital'){let best=null,bc=-1;const pool=[...R.en,...R.hives];for(const e of pool){let c=0;for(const o of R.en)if((o.x-e.x)**2+(o.y-e.y)**2<90*90)c++;if(e.isHive)c+=3;if(c>bc){bc=c;best=e;}}
    if(!best){toast('No targets');return;}R.strikes.push({x:best.x,y:best.y,t:.8,done:false});snd(1400,.8,'sine',.04,.2);}
  else if(k==='repair'){S.hull=Math.min(D.hull,S.hull+D.hull*.6);sparks(MX,MY-30,20,'#5dff9b');R.parts.push({x:MX,y:MY-20,vx:0,vy:0,life:.6,max:.6,col:'#5dff9b',size:50,type:'ring'});snd(500,.4,'sine',.05,2);}
  R.cd[k]=ABIL[k].cd;
}
function resetRun(){R.en=[];R.sq=[];R.hives=[];R.pr=[];R.ep=[];R.strikes=[];R.focus=null;R.parts=[];R.nums=[];}
function doReboot(){
  const g=coresGain();if(!g)return;
  S.cores+=g;S.prestiges++;S.money=50+150*S.prestiges;S.hp=[{lvl:1,w:S.hp[0]&&S.hp[0].w},null,null,null,null,null];S.tree={};S.wave=1;S.maxWaveRun=1;S.farm=false;S.hull=null;
  resetRun();recalc();startWave();banner('REBOOT COMPLETE','#3fe0ff');toast('+'+g+' Reactor Cores installed','#3fe0ff');renderPanel();save();
}
// tap battlefield
cv.addEventListener('pointerdown',ev=>{
  initAudio();
  const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*VW/r.width,y=(ev.clientY-r.top)*VH/r.height;
  let best=null,bd=1e9;
  for(const e of [...R.en,...R.hives]){const ey=e.def&&e.def.fly?e.y-12:e.y;const d=Math.hypot(e.x-x,ey-y);if(d<e.r+16&&d<bd){bd=d;best=e;}}
  R.focus=best;if(best)snd(1100,.05,'square',.02);
});
$('#panel').addEventListener('pointerdown',()=>R.pdown=true);$('#modal').addEventListener('pointerdown',()=>R.pdown=true);
window.addEventListener('pointerup',()=>R.pdown=false);
window.addEventListener('pointercancel',()=>R.pdown=false);

/* offline */
function offlineGain(ms){
  const sec=Math.min(ms/1000,8*3600);if(sec<30||!S.avgIncome)return;
  const v=S.avgIncome*sec*D.offline;S.money+=v;S.stats.earned+=v;
  openModal(`<h2>Welcome back, pilot</h2><p class="note">Your drones kept salvaging for ${Math.floor(sec/3600)}h ${Math.floor(sec%3600/60)}m.</p><div class="mrow mono" style="text-align:center;margin:14px 0;font-size:30px"><span style="color:#ffa62b">$</span> ${fmt(v)}</div><button class="unlock" data-act="close" style="margin:0">COLLECT</button>`);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){R.hiddenAt=Date.now();save();}else if(R.hiddenAt){offlineGain(Date.now()-R.hiddenAt);R.hiddenAt=0;last=performance.now();}});
window.addEventListener('pagehide',save);
window.addEventListener('resize',resize);

/* loop */
let last=performance.now(),uiT=0,panelT=0,saveT=0;
const fin=o=>isFinite(o.x)&&isFinite(o.y);
function sanitize(){R.parts=R.parts.filter(p=>fin(p)&&isFinite(p.size));R.scorch=R.scorch.filter(s=>fin(s)&&isFinite(s.r));R.pr=R.pr.filter(fin);R.ep=R.ep.filter(fin);R.orbs=R.orbs.filter(fin);R.nums=R.nums.filter(fin);R.strikes=R.strikes.filter(fin);
  for(const e of R.en)if(!fin(e)){e.x=VW*.8;e.y=-20;e.vx=e.vy=0;}for(const d of R.drones)if(!fin(d)){d.x=MX;d.y=MY-30;}R.beams=R.beams.filter(b=>isFinite(b.x1+b.y1+b.x2+b.y2));R.arcs=[];if(!isFinite(R.aim))R.aim=-.5;}
let errN=0,lastFrame=performance.now(),rafId=0;
setInterval(()=>{if(!document.hidden&&performance.now()-lastFrame>1500){cancelAnimationFrame(rafId);last=performance.now();rafId=requestAnimationFrame(loop);}},1000);
function loop(now){
  lastFrame=performance.now();
  rafId=requestAnimationFrame(loop);
  try{step(now);errN=0;}catch(e){errN++;try{console.error(e);sanitize();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}catch(_){}
    if(errN===30)toast('Recovered from a glitch','#ff4d5e');}
}
function step(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  if(!R.paused){update(dt);if(S.speed===2&&!R.paused)update(dt);}else{R.time+=dt*.2;}draw();
  uiT+=dt;panelT+=dt;saveT+=dt;
  if(uiT>.15){uiT=0;hud();updatePanel();}
  if(panelT>1){panelT=0;if(!R.pdown&&!$('#modal').classList.contains('on'))renderPanel();if(modalKind==='missions'&&!R.pdown)showMissions();}
  if(saveT>5){saveT=0;save();}
}
load();resize();recalc();fillMissions();startWave();renderPanel();hud();
if(S.hp[0]&&!S.hp[0].w){S.hp[0].w={id:0,rar:0};recalc();renderPanel();}
if(S.last)offlineGain(Date.now()-S.last);
else toast('Tap enemies or Hives to focus fire. Buy upgrades below.','#3fe0ff');
requestAnimationFrame(loop);
</script>
</body>
</html>
