<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mech Siege: Hive War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c131a;--panel:#111b25;--card:#142130;--line:#27405a;--cyan:#3fe0ff;--orange:#ffa62b;--text:#e2ecf5;--dim:#7f93a6;--red:#ff4d5e;--green:#5dff9b;--purple:#b77bff;--pink:#ff4d9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#05080c;color:var(--text);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.mono{font-family:'Share Tech Mono',monospace}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
/* header */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px 4px;background:linear-gradient(#101a24,#0c131a)}
.ibtn{width:40px;height:40px;border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;position:relative;background:#0f1a24;flex:none}
.ibtn svg{width:22px;height:22px}
#misDot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);display:none}
.money{flex:1;text-align:center;line-height:1}
.mrow{font-family:'Share Tech Mono',monospace;font-size:32px;letter-spacing:1px}
.mrow .dl{color:var(--orange);margin-right:6px}
#rate{color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:14px;margin-top:2px}
.gems{text-align:right;font-family:'Share Tech Mono',monospace;line-height:1.1}
.gems .big{font-size:22px}
.gems .gem{color:var(--cyan)}
.gems .sub{font-size:11px;color:var(--dim)}
#wavebar{padding:2px 12px 6px}
.wrow{display:flex;justify-content:space-between;align-items:center;font-family:'Share Tech Mono',monospace;font-size:15px}
#farmBtn{font-size:11px;border:1px solid var(--line);padding:2px 7px;margin-left:8px;border-radius:3px;color:var(--green)}
#farmBtn.farm{color:var(--orange);border-color:var(--orange)}
.pbar{height:6px;background:#0a1118;border:1px solid #2b4459;margin-top:3px;position:relative;overflow:hidden}
.pbar i{position:absolute;inset:0;width:0;background:var(--orange);transition:width .2s}
.pbar.hull{height:9px}
.pbar.hull i{background:linear-gradient(90deg,#29c7e8,#5ff0ff)}
.pbar.hull.low i{background:linear-gradient(90deg,#ff3045,#ff7a5a)}
#hullTxt{position:absolute;right:4px;top:-2px;font-size:9px;font-family:'Share Tech Mono',monospace;color:#d8f6ff;text-shadow:0 0 3px #000}
/* game */
#game{position:relative;flex:0 0 auto;height:46vh;min-height:250px;max-height:470px;border-top:1px solid #1e3042;border-bottom:2px solid #1e3042;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toasts{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:3}
.toast{background:rgba(8,14,20,.88);border:1px solid var(--line);padding:4px 10px;font-size:12px;border-radius:3px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#boost{position:absolute;left:8px;bottom:8px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(10,18,26,.88);border:1px solid var(--orange);padding:5px 9px;border-radius:3px;font-size:12px;line-height:1.1;text-align:left}
#boost b{color:var(--orange)}
#boost small{color:var(--dim);display:block}
#boost.cd{border-color:var(--line);opacity:.75}
#mini{position:absolute;right:8px;top:8px;width:84px;height:84px;border:1px solid #2b4459;background:#05070a;z-index:2;image-rendering:pixelated}
#spd{position:absolute;left:8px;bottom:60px;z-index:4;background:rgba(10,18,26,.88);border:1px solid var(--cyan);color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:14px;padding:6px 11px;border-radius:3px}
#spd.x2{background:var(--cyan);color:#06222b;box-shadow:0 0 12px var(--cyan)}
#abil{position:absolute;right:8px;bottom:8px;display:flex;gap:7px;z-index:2}
.ab{width:50px;height:50px;border-radius:50%;position:relative;background:conic-gradient(rgba(0,0,0,.65) calc(var(--p,0)*1%),transparent 0),radial-gradient(#1b2c3c,#0d1720);border:2px solid var(--cyan);display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:.5px}
.ab svg{width:22px;height:22px;margin-top:-6px}
.ab span{position:absolute;bottom:5px}
.ab.lock{border-color:#33475a;opacity:.45}
.ab.ready{box-shadow:0 0 10px var(--cyan)}
.ab.active{border-color:var(--orange);box-shadow:0 0 14px var(--orange)}
/* panel */
#panel{flex:1;overflow-y:auto;padding:10px 10px 14px;background:var(--panel);-webkit-overflow-scrolling:touch}
#panel::-webkit-scrollbar{width:4px}#panel::-webkit-scrollbar-thumb{background:#2a3f52}
.card{position:relative;background:var(--card);border:1px solid #23394d;margin-bottom:9px;padding:9px}
.card:before,.card:after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--cyan);pointer-events:none}
.card:before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.card:after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.h{font-size:13px;color:var(--dim);letter-spacing:1px;margin:4px 2px 8px;text-transform:uppercase}
.h b{color:var(--cyan)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:5px 9px;font-size:12px;font-family:'Share Tech Mono',monospace;color:var(--dim)}
.seg button.on{background:var(--cyan);color:#06222b}
.wcard{display:flex;align-items:center;gap:10px}
.wico{width:52px;height:52px;flex:none;border:1px solid #2b4459;display:grid;place-items:center;background:#0d1822}
.wico svg{width:40px;height:40px}
.wmid{flex:1;min-width:0}
.wname{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar{height:6px;background:#0a1118;margin:5px 0 4px;position:relative}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
.wsub{font-size:12px;color:var(--dim);font-family:'Share Tech Mono',monospace;display:flex;gap:10px}
.wsub .ms{color:var(--orange)}
.buy{flex:none;min-width:94px;padding:6px 8px;border:1px solid var(--cyan);background:#0f2532;text-align:right;font-family:'Share Tech Mono',monospace;line-height:1.15}
.buy small{display:block;font-size:11px;color:var(--cyan)}
.buy b{font-size:15px;font-weight:400}
.buy b em{color:var(--orange);font-style:normal}
.buy.dis{border-color:#2a3a48;background:#121c26;color:#677a8c}
.buy.dis small{color:#55697b}
.buy.max{border-color:#2a3a48;color:var(--green)}
.unlock{width:100%;background:var(--orange);color:#1a1205;font-size:18px;font-family:'Share Tech Mono',monospace;padding:16px;margin-bottom:9px;font-weight:700;letter-spacing:1px;position:relative}
.unlock.dis{background:#5b4523;color:#2c2210}
.unlock small{display:block;font-size:11px;font-weight:400;opacity:.8;letter-spacing:0}
.locked{opacity:.4;font-size:13px;padding:12px;text-align:center;letter-spacing:2px}
.wico{position:relative}.edot{position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor}
.wtag{font-size:11px;color:var(--dim);font-family:'Share Tech Mono',monospace}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{border:2px solid;background:#0f1a24;padding:9px;display:flex;flex-direction:column;min-width:0}
.dcard .wname{font-size:15px;line-height:1.15;margin-top:4px}
.dico{width:60px;height:60px;margin:6px auto 2px;border:1px solid #2b4459;display:grid;place-items:center;position:relative;background:#0b141c}.dico svg{width:46px;height:46px}
.wl{font-size:11.5px;color:#b9c7d4;margin-top:6px;line-height:1.35}.wl.stats{color:var(--cyan);font-family:'Share Tech Mono',monospace;flex:1}
.newb{font-size:10px;background:var(--green);color:#062a14;padding:1px 6px;font-weight:700;letter-spacing:1px}
.slist{display:flex;flex-direction:column;gap:5px}
.srow{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#0f1a24;border:1px solid #23394d;border-left:4px solid #2b4459;padding:7px 9px;width:100%}
.srow .sn{font-size:14px;font-weight:600}
/* fab shop */
#fab{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0,#2a3644,#141c25 60%);padding:8px 10px;overflow:hidden}
#fab.on{display:flex}
.fhead{display:flex;align-items:center;gap:8px}.fhead b{font-size:17px;letter-spacing:2px;color:var(--orange)}.fhead .x{position:static;margin-left:auto;font-size:22px;color:var(--dim)}
.ftabs{display:flex;gap:4px;overflow-x:auto}.ftab{border:1px solid var(--line);padding:4px 8px;font-size:12px;font-family:'Share Tech Mono',monospace;color:var(--dim)}.ftab.on{background:var(--cyan);color:#06222b}
.fname{font-size:15px;font-weight:600;margin:6px 2px 2px}
#gunWrap{position:relative;height:150px;flex:none;margin:2px 0;border:1px solid #2b4459;background:repeating-linear-gradient(0deg,#1c2733 0 10px,#1a2430 10px 20px);border-radius:4px}
#gunWrap.drop{border-color:var(--orange);box-shadow:inset 0 0 22px rgba(255,166,43,.35)}
#gunCv{position:absolute;inset:0;width:100%;height:100%}
.sock{position:absolute;transform:translate(-50%,-50%);font-size:9.5px;padding:2px 5px;border:1.5px dashed #33475a;background:rgba(10,18,26,.82);color:#cfe2f0;border-radius:3px;white-space:nowrap;font-family:'Share Tech Mono',monospace}
.sock.full{border-style:solid}.sock.ok{border-color:var(--orange)!important;color:var(--orange);box-shadow:0 0 10px var(--orange)}.sock.hot{background:var(--orange);color:#1a1205}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 8px;font-size:11.5px;margin-top:4px}.fs{display:flex;flex-direction:column;background:#101a24;border:1px solid #20324a;padding:3px 6px}
.fs span{color:var(--dim);font-size:10px}.fs b{font-family:'Share Tech Mono',monospace;font-weight:400;font-size:13px}.fs i{font-style:normal;font-size:10.5px;font-family:'Share Tech Mono',monospace}
.fperks{margin:4px 2px;color:#ffd27a}
.frow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.frow .btn{padding:6px 9px;font-size:12px}
.ffilt{display:flex;gap:4px;overflow-x:auto;margin-bottom:6px;flex:none}.fchip{border:1px solid var(--line);padding:4px 8px;font-size:11px;white-space:nowrap;color:var(--dim)}.fchip.on{border-color:var(--orange);color:var(--orange)}
#fbin{flex:1;overflow-y:auto;align-content:start;min-height:80px;background:#1d2a36;border-radius:4px;padding:6px;
  background-image:radial-gradient(#0e151c 1.6px,transparent 1.7px);background-size:16px 16px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ptile{position:relative;aspect-ratio:1;border:2px solid;background:linear-gradient(#24323f,#18222c);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;box-shadow:0 3px 0 #0b1016}
.ptile .pico{width:70%;height:auto}.ptile .pn{font-size:9px;line-height:1;margin-top:2px;color:#d7e3ee;max-width:96%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ptile .rb{position:absolute;left:3px;right:3px;bottom:2px;height:2px;border-radius:2px}
.ptile.lift{transform:scale(1.12);box-shadow:0 0 14px var(--rc)}.ptile.ghost{position:fixed;width:56px;z-index:50;pointer-events:none;opacity:.92;transform:scale(1.15) rotate(-6deg);box-shadow:0 8px 20px rgba(0,0,0,.6)}
.ptile.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.4);opacity:0}}
.wico canvas{width:52px;height:52px}
/* tree */
.node{display:flex;align-items:center;gap:8px;position:relative}
.node .nm{flex:1;min-width:0}
.node .nm b{font-size:14px;font-weight:600;display:block}
.node .nm small{font-size:11.5px;color:var(--dim)}
.node .lv{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--cyan)}
.tree-d1{margin-left:18px}.tree-d2{margin-left:36px}
.tree-d1:before,.tree-d2:before{}
.branch{position:absolute;left:-12px;top:-10px;bottom:50%;width:10px;border-left:2px solid #2b4a63;border-bottom:2px solid #2b4a63}
.nlock{opacity:.45}
/* modules */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mod{aspect-ratio:1;border:2px solid #2a3a48;background:#0d1822;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-family:'Share Tech Mono',monospace;position:relative;line-height:1.1;text-align:center}
.mod .mi{font-size:18px;font-family:'Chakra Petch';font-weight:700}
.mod.empty{border-style:dashed;color:#41566a}
.mod .cnt{position:absolute;top:1px;right:3px;font-size:9px;color:var(--dim)}
.btn{border:1px solid var(--cyan);padding:8px 12px;font-size:13px;background:#0f2532}
.btn.o{border-color:var(--orange);color:var(--orange);background:#2a1d0c}
.btn.dis{opacity:.4}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed #22364a}
.stat b{font-family:'Share Tech Mono',monospace;font-weight:400;color:var(--cyan)}
/* nav */
#nav{display:flex;justify-content:space-between;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0b1219;border-top:1px solid #1e3042}
#nav button{flex:1;height:52px;border:2px solid #24384b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:1px;color:var(--dim);position:relative;background:#0f1923}
#nav button svg{width:24px;height:24px;margin-bottom:2px}
#nav button.on{color:var(--orange);border-color:transparent;background:#14202b}
#nav button.on:before,#nav button.on:after{content:'';position:absolute;width:12px;height:12px;border:3px solid var(--orange)}
#nav button.on:before{left:-2px;top:-2px;border-right:0;border-bottom:0}
#nav button.on:after{right:-2px;bottom:-2px;border-left:0;border-top:0}
/* modal */
#modal{position:absolute;inset:0;background:rgba(3,6,10,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
#modal.on{display:flex}
.mbox{width:100%;max-width:420px;max-height:88%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);padding:16px;position:relative}
.mbox h2{margin:0 0 10px;font-size:20px;letter-spacing:1px}
.mbox .x{position:absolute;right:10px;top:8px;font-size:22px;color:var(--dim)}
.mis{display:flex;align-items:center;gap:10px}
.mis .nm{flex:1;font-size:14px}
.mis .pb{height:5px;background:#0a1118;margin-top:5px}
.mis .pb i{display:block;height:100%;background:var(--green)}
.note{font-size:12px;color:var(--dim);line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ibtn" data-act="missions" aria-label="Missions"><svg viewBox="0 0 24 24" fill="none" stroke="#ffa62b" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="1"/><path d="M9 4V2h6v2M8 10l2 2 4-4M8 16h8"/></svg><i id="misDot"></i></button>
    <div class="money"><div class="mrow"><span class="dl">$</span><span id="money">0</span></div><div id="rate">0/s</div></div>
    <div class="gems"><div class="big"><span id="crys">0</span> <span class="gem">◆</span></div><div class="sub" id="coresTxt">Cores 0</div></div>
    <button class="ibtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="#7f93a6" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
  <div id="wavebar">
    <div class="wrow"><span><span id="waveTxt" data-act="planets" style="text-decoration:underline dotted;cursor:pointer">Wave 1</span><button id="farmBtn" data-act="farm">AUTO ▶</button></span><span id="waveCnt">0/0</span></div>
    <div class="pbar"><i id="wp"></i></div>
    <div class="pbar hull" id="hullBar"><i id="hp"></i><span id="hullTxt"></span></div>
  </div>
  <div id="game">
    <canvas id="cv"></canvas>
    <canvas id="mini" width="168" height="168"></canvas>
    <div id="toasts"></div>
    <button id="boost" data-act="boost"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ffa62b"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span><b>Boost $x2</b><small id="boostTxt">+5 min</small></span></button>
    <button id="spd" data-act="speed">▶ 1×</button>
    <div id="abil">
      <button class="ab" data-act="ab" data-k="overdrive"><svg viewBox="0 0 24 24" fill="#ffa62b"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>OVRDRV</span></button>
      <button class="ab" data-act="ab" data-k="orbital"><svg viewBox="0 0 24 24" fill="none" stroke="#3fe0ff" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6"/></svg><span>ORBITAL</span></button>
      <button class="ab" data-act="ab" data-k="repair"><svg viewBox="0 0 24 24" fill="#5dff9b"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg><span>REPAIR</span></button>
    </div>
  </div>
  <div id="panel"></div>
  <div id="nav">
    <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>SHOP</button>
    <button data-tab="mech" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h8v3h3v6h-3v2h2v7h-4v-5h-4v5H6v-7h2v-2H5V6h3z"/></svg>MECH</button>
    <button data-tab="tree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5L6 16.5M12 11.5l6 5"/></svg>TREE</button>
    <button data-tab="armory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M17.5 14v7M14 17.5h7"/></svg>ARMORY</button>
    <button data-tab="reboot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6 6 1-4.5 4.3 1 6.2L12 16.6 6.5 19.5l1-6.2L3 9l6-1z"/></svg>REBOOT</button>
  </div>
  <div id="fab"></div>
  <div id="modal"><div class="mbox" id="mbox"></div></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();
  const e=Math.floor(Math.log10(n)/3);let s;
  if(e<SUF.length)s=SUF[e];else{const k=e-SUF.length;s=String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26);}
  const v=n/Math.pow(1000,e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+s;
}

/* ================= DATA ================= */
/* ---- 12,000-weapon pool: 10 bases x 20 prefixes x 5 elements x 12 suffixes (HORDEFALL-style) ---- */
const HPT=[ // hardpoint tiers: unlock cost, level cost, growth, dps per level
  {unlock:0,cost:10,r:1.12,dps:5},{unlock:400,cost:250,r:1.125,dps:55},{unlock:12e3,cost:7e3,r:1.13,dps:800},

  const s=48;let seed=7;const sr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(let i=-30;i<30;i++)for(let j=-30;j<30;j++){
    const cx=(i-j)*s/2+VW/2,cy=(i+j)*s/4+VH/2;if(cx<-s||cx>VW+s||cy<-s||cy>VH+s)continue;
    const v=sr();if(v<.35){g.fillStyle=v<.12?'rgba(0,0,0,.16)':'rgba(255,255,255,.025)';g.beginPath();g.moveTo(cx,cy-s/4);g.lineTo(cx+s/2,cy);g.lineTo(cx,cy+s/4);g.lineTo(cx-s/2,cy);g.fill();}
  }
  g.strokeStyle='rgba(140,170,195,.09)';g.lineWidth=1;
  for(let c=-VH*2;c<VW+VH*2;c+=s){g.beginPath();g.moveTo(c,0);g.lineTo(c+VH*2,VH);g.stroke();g.beginPath();g.moveTo(c,0);g.lineTo(c-VH*2,VH);g.stroke();}
  // neon seams
  g.save();g.globalCompositeOperation='lighter';
  const seam=(x1,y1,x2,y2)=>{for(const [w,a] of [[7,.06],[3,.18],[1.4,.9]]){g.strokeStyle=`rgba(63,224,255,${a})`;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}};
  seam(-10,VH*.42,VW*.58,VH*-.05);seam(VW*.62,VH*1.02,VW+10,VH*.72);
  g.restore();
  // scorch-like stains
  for(let i=0;i<14;i++){const x=sr()*VW,y=sr()*VH,r=10+sr()*30;const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba(0,0,0,.22)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);}
  // structures top-left
  isoBox(g,40,VH*.18,60,70,46,'#3a4652','#252e37','#2f3a45');
  isoBox(g,-10,VH*.33,40,40,30,'#34404b','#222a32','#2b353f');
  g.fillStyle='rgba(63,224,255,.55)';g.fillRect(55,VH*.18-40,14,3);
  // rocks
  for(let i=0;i<10;i++){const x=VW*.3+sr()*VW*.7,y=VH*.15+sr()*VH*.8,r=4+sr()*7;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x+2,y+r*.6,r*1.1,r*.5,0,0,TAU);g.fill();
    g.fillStyle='#3d4853';g.beginPath();g.moveTo(x-r,y);g.lineTo(x-r*.4,y-r*1.4);g.lineTo(x+r*.6,y-r*1.1);g.lineTo(x+r,y);g.lineTo(x,y+r*.5);g.fill();
    g.fillStyle='#55626e';g.beginPath();g.moveTo(x-r*.4,y-r*1.4);g.lineTo(x+r*.6,y-r*1.1);g.lineTo(x+r*.1,y-r*.3);g.fill();}
}

const BUILDS=BASES.length*SLOTS.reduce((a,sl)=>a*(PARTS[sl].length+1),1);
const pDef=p=>PARTS[p.s][p.m];
const newGun=f=>({f,p:{}});
function gunPower(w){let t=1;for(const sl of SLOTS){const p=w.p[sl];if(p)t+=.12*(RM[p.r]-1);}return t}
function gunTier(w){let t=0,n=0;for(const sl of SLOTS){const p=w.p[sl];if(p){t+=p.r;n++;}}return n?Math.round(t/n):0}
function gunName(w){const c=w.p.core,b=w.p.barrel||w.p.mag;return `${c?ELEM[c.m].w+' ':''}${b?pDef(b).w+' ':''}${BASES[w.f].name}`}
function gunMk(w){return 'Mk '+['I','II','III','IV','V','VI'][gunTier(w)]}
function gunStats(w,i,l){
  const b=BASES[w.f];
  const s={kind:b.kind,rate:b.rate,pellets:b.pellets||1,spread:b.spread||0,spd:b.spd||1000,pierce:b.pierce||0,aoe:b.aoe||0,range:b.range||0,chains:b.chains||0,
    homing:!!b.homing,big:!!b.big,dmgM:b.dmg,crit:0,critMult:0,leech:0,perks:{},bossM:1,echo:0,elM:1,greed:0,thunder:0,odM:1,el:-1,col:'#ffd27a',i};
  for(const sl of SLOTS){const p=w.p[sl];if(p)PARTS[sl][p.m].ap(s,RM[p.r]);}
  s.echo=Math.min(.6,s.echo);s.power=gunPower(w);
  s.dmg=HPT[i].dps*Math.max(1,l)*Math.pow(2,Math.floor(l/25))*s.power*s.dmgM/(b.rate*(b.pellets||1));
  {const bp=b.pellets||1;if(s.pellets>bp)s.dmg*=(bp+.4*(s.pellets-bp))/s.pellets;}
  s.dps=s.dmg*s.rate*s.pellets*(1+s.echo);
  return s;
}
function wStats(i){const h=S.hp[i];if(!h||!h.w)return null;return gunStats(h.w,i,h.lvl)}
// overall value of a build, counting effects that raw DPS misses
function gunScore(w,i,l){const s=gunStats(w,i,l);let v=s.dps*(1+Math.min(.75,D.crit+s.crit)*(D.critDmg+s.critMult-1));
  if(s.aoe)v*=1.3;if(s.pierce)v*=1+.1*Math.min(4,s.pierce);if(s.perks.split)v*=1+s.perks.split*.8;if(s.perks.storm)v*=1+s.perks.storm*.7;if(s.perks.nova)v*=1+s.perks.nova*1.2;if(s.perks.ricochet)v*=1+.1*s.perks.ricochet;
  if(s.thunder)v*=1+s.thunder*1.2;if(s.el>=0)v*=1.1+.05*s.elM;if(s.homing)v*=1.06;if(s.leech)v*=1+.02*s.leech;if(s.greed)v*=1+s.greed*.6;v*=1+(s.bossM-1)*.25;return v}

/* ---- parts inventory ---- */
const BIN_MAX=400;
function rollPart(bonus,slot){const sl=slot||SLOTS[Math.floor(Math.random()*SLOTS.length)];return{u:S.nextId++,s:sl,m:Math.floor(Math.random()*PARTS[sl].length),r:rollWRar(bonus)}}
function partVal(p){return rewScale(S.wave)*2*Math.pow(p.r+1,2)}
function addPart(p){S.parts.push(p);const key=p.s+p.m+'_'+p.r;if(!S.pfound.includes(key))S.pfound.push(key);
  if(S.parts.length>BIN_MAX){S.parts.sort((a,b)=>a.r-b.r);const x=S.parts.shift();S.money+=partVal(x);}}
const PF_TOTAL=SLOTS.reduce((a,sl)=>a+PARTS[sl].length,0)*6;
function crateRoll(){const out=[];for(let k=0;k<3;k++)out.push(rollPart(.2));let fr=null;
  const miss=BASES.map((b,i)=>i).filter(i=>!S.frames.includes(i));if(miss.length&&Math.random()<.1)fr=miss[Math.floor(Math.random()*miss.length)];return{parts:out,frame:fr}}
function partTile(p,extra){const c=WRAR[p.r][1];return `<button class="ptile ${extra||''}" data-u="${p.u}" style="border-color:${c};--rc:${c}">${slotIcon(p.s,p.s==='core'?ELEM[p.m].col:c)}<span class="pn">${pDef(p).w}</span><i class="rb" style="background:${c}"></i></button>`}
function openCrates(n){
  n=Math.min(n,S.caches);if(n<=0)return;S.caches-=n;const got=[];const frames=[];
  for(let k=0;k<n;k++){const c=crateRoll();for(const p of c.parts){addPart(p);got.push(p);}if(c.frame!=null&&!S.frames.includes(c.frame)){S.frames.push(c.frame);frames.push(c.frame);}}

  if(got.length<=9)h+=`<div class="pgrid" style="margin-bottom:8px">${got.map(p=>partTile(p,'pop')).join('')}</div>`;
  else h+=cnt.map((c,r)=>c?`<div class="stat"><span style="color:${WRAR[r][1]}">${WRAR[r][0]} parts</span><b>×${c}</b></div>`:'').join('');
  h+=`<div class="note" style="margin:8px 0">${m?`Auto-merged ${m} times. `:''}Bin: ${S.parts.length} parts.</div><button class="unlock" style="margin:0" data-act="fab">🔧 OPEN FAB SHOP</button>`;
  openModal(h,'crate');renderPanel();snd(700,.3,'triangle',.05,1.8);
}
// three identical parts (same model + rarity) fuse into one of the next rarity
function autoMergeParts(){let n=0;const cap=mergeCap();let again=true;
  while(again){again=false;const g={};for(const p of S.parts){if(p.r>=cap)continue;const k=p.s+'|'+p.m+'|'+p.r;(g[k]=g[k]||[]).push(p);}
    for(const k in g){const L=g[k];while(L.length>=3){const used=L.splice(0,3);S.parts=S.parts.filter(p=>!used.includes(p));addPart({u:S.nextId++,s:used[0].s,m:used[0].m,r:used[0].r+1});n++;again=true;}}}
  S.stats.fused+=n;return n}
function mergePart(u){const p=S.parts.find(x=>x.u===u);if(!p||p.r>=mergeCap())return false;const f=S.parts.filter(x=>x!==p&&x.s===p.s&&x.m===p.m&&x.r===p.r).slice(0,2);if(f.length<2)return false;
  S.parts=S.parts.filter(x=>!f.includes(x));p.r++;S.stats.fused++;const key=p.s+p.m+'_'+p.r;if(!S.pfound.includes(key))S.pfound.push(key);return true}
function installPart(i,u){const h=S.hp[i];if(!h||!h.w)return;const p=S.parts.find(x=>x.u===u);if(!p)return;
  S.parts=S.parts.filter(x=>x!==p);const old=h.w.p[p.s];if(old)S.parts.push(old);h.w.p[p.s]=p;recalc();}
function removePart(i,sl){const h=S.hp[i];if(!h||!h.w||!h.w.p[sl])return;S.parts.push(h.w.p[sl]);delete h.w.p[sl];recalc();}
function autoBuild(i){
  const h=S.hp[i];if(!h||!h.w)return 0;const w=h.w;let changed=0;
  for(const sl of SLOTS)if(w.p[sl]){S.parts.push(w.p[sl]);delete w.p[sl];}
  for(let pass=0;pass<2;pass++)for(const sl of SLOTS){
    const cur=w.p[sl];let best=cur,bv=gunScore(w,i,h.lvl);
    for(const p of S.parts){if(p.s!==sl)continue;w.p[sl]=p;const v=gunScore(w,i,h.lvl);if(v>bv*1.0001){bv=v;best=p;}}
    if(cur)w.p[sl]=cur;else delete w.p[sl];
    if(best&&best!==cur){if(cur)S.parts.push(cur);S.parts=S.parts.filter(x=>x!==best);w.p[sl]=best;changed++;}}
  recalc();return changed;
}
function partFromOld(slot,model,r){return{u:S.nextId++,s:slot,m:model,r}}
// convert the old 12,000-weapon guns/stash into frames + parts
const PRE_MAP=[['barrel',3],['barrel',1],['mag',2],['barrel',2],['mag',3],['chip',0],['stock',0],['barrel',0],['mag',0],['muzzle',5],['barrel',4],['stock',1],['mag',1],['chip',5],['mag',5],['optic',2],['muzzle',0],['mag',4],['muzzle',1],['muzzle',2]];
const SUF_MAP=[null,['chip',4],['chip',2],['mag',2],['muzzle',3],['stock',3],['chip',5],['chip',1],['optic',0],['mag',3],['muzzle',4],['chip',3]];
function disassemble(old){const f=Math.floor(old.id%1000/100),pr=PRE_MAP[Math.floor(old.id%100/5)],sx=SUF_MAP[Math.floor(old.id/1000)];const parts=[partFromOld('core',old.id%5,old.rar),partFromOld(pr[0],pr[1],old.rar)];if(sx)parts.push(partFromOld(sx[0],sx[1],old.rar));return{f,parts}}
function migrateGuns(){
  if(!Array.isArray(S.parts))S.parts=[];if(!Array.isArray(S.frames))S.frames=[0];if(!Array.isArray(S.pfound))S.pfound=[];
  for(const h of S.hp){if(!h||!h.w||h.w.id==null)continue;const d=disassemble(h.w);if(!S.frames.includes(d.f))S.frames.push(d.f);const g=newGun(d.f);

}

function drawGunArt(cv,w){
  const g=cv.getContext('2d'),Wd=cv.width,Hd=cv.height;g.clearRect(0,0,Wd,Hd);

    else if(m===3)rr(16,56,72,32,6,BODY2,c);

  else{g.fillStyle=DARK;g.fillRect(70,64,18,10);}

  if(kind==='beam'||kind==='chain'||kind==='cone'||kind==='mortar'||kind==='missile'){} // these frames show their own emitter
  if(P.barrel){const m=P.barrel.m;

    else if(m===2){barrel(56,74,9);barrel(72,74,9);bEnd=bx+74;}
    else if(m===3){barrel(55,70,7);barrel(64,70,7,'#c0ccd6');barrel(73,70,7);rr(bx+40,50,10,28,3,Y);bEnd=bx+70;}
    else if(m===4){barrel(64,84,12);g.strokeStyle=OL;g.lineWidth=1.5;for(let x=bx+10;x<bx+80;x+=10){g.beginPath();g.moveTo(x,59);g.lineTo(x,69);g.stroke();}bEnd=bx+84;}
    else{barrel(64,40,18,'#7b8692');bEnd=bx+40;}}
  else barrel(64,34,9);

    else if(m===1){for(let k=0;k<3;k++){g.strokeStyle=k%2?'#3fe0ff':c;g.lineWidth=3;g.beginPath();g.ellipse(mx+5+k*7,my,4,11,0,0,TAU);g.stroke();}}

    else if(m===4){for(let k=0;k<3;k++){g.beginPath();g.arc(172+k*12,102+(k%2)*8,8,0,TAU);g.fillStyle='#d06a1a';g.fill();g.lineWidth=2;g.strokeStyle=c;g.stroke();}}

  // optic

    else if(m===2){rr(140,20,44,22,4,'#2b3a48',c);g.fillStyle='#3fe0ff';g.fillRect(146,25,32,12);}
    else if(m===3){rr(130,24,60,16,8,DARK,c);g.fillStyle='#ff8a3a';g.beginPath();g.arc(186,32,6,0,TAU);g.fill();}
    else if(m===4){rr(120,24,32,16,8,DARK,c);rr(160,24,32,16,8,DARK,c);}
    else{rr(150,26,28,16,4,DARK,c);g.fillStyle='#ff3d3d';g.beginPath();g.arc(170,34,3,0,TAU);g.fill();}

  // core window

let W=null;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const planetIdx=(g,p)=>(g-1)*5+p;
const planetBase=(g,p)=>(planetIdx(g,p)-1)*5+1;
function genWorld(seed,g,p){
  const rng=mulberry(seed),n=Math.min(170,PSIZE[p-1]+(g-1)*12),G=new Int8Array(n*n),c=n>>1;
  const dDense=.16+.03*g;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x;G[i]=(x===0||y===0||x===n-1||y===n-1)?BED:(rng()<dDense?1:0);}
  const inb=(x,y)=>x>0&&y>0&&x<n-1&&y<n-1;
  // ore veins (richer far from the landing zone and on later planets)
  const veins=Math.floor(n*n/45);
  for(let v=0;v<veins;v++){let x=1+Math.floor(rng()*(n-2)),y=1+Math.floor(rng()*(n-2));const d=Math.hypot(x-c,y-c)/(n/2);
    const r=rng()*(1+d*.8+(planetIdx(g,p)-1)*.08);const t=r>1.75&&d>.55?8:r>1.45?5:r>1.15?4:r>.75?3:2;const len=3+Math.floor(rng()*7);
    for(let k=0;k<len;k++){if(inb(x,y))G[y*n+x]=t;x+=Math.floor(rng()*3)-1;y+=Math.floor(rng()*3)-1;}}
  // caves
  const caves=3+p+g;
  for(let v=0;v<caves;v++){let x,y,t=0;do{x=2+Math.floor(rng()*(n-4));y=2+Math.floor(rng()*(n-4));t++;}while(Math.hypot(x-c,y-c)<9&&t<50);
    const len=25+Math.floor(rng()*(40+n));for(let k=0;k<len;k++){if(inb(x,y))G[y*n+x]=-1;if(rng()<.5&&inb(x+1,y))G[y*n+x+1]=-1;const d=Math.floor(rng()*4);x+=d===0?1:d===1?-1:0;y+=d===2?1:d===3?-1:0;x=clamp(x,2,n-3);y=clamp(y,2,n-3);}}
  // landing pad
  for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++)if(x*x+y*y<=12)G[(c+y)*n+c+x]=-1;

  const hives=[];const nh=Math.min(8,1+p+(g-1));

}
function newPlanet(g,p,seed,diff){

     flow:new Int32Array(w.n*w.n),order:[],hiveDefs:w.hives,hd:[],steps:0,pen:0,gSpawned:false,gDead:false,clearT:0,flowT:0,flowDirty:true,miniDirty:true};

  buildHives();setLevel();reveal(w.c,w.c,8);

function buildHives(){

    R.hives.push({isHive:true,k,x:(d.tx+.5)*T,y:(d.ty+.5)*T,hp,max:hp,r:28,lvl:1,spawnT:3,flash:0,acc:0,accT:0,t:0,dead:false,heard:false});});
}
function b64(u8){let s='';for(let i=0;i<u8.length;i+=8){let b=0;for(let k=0;k<8;k++)if(u8[i+k])b|=1<<k;s+=String.fromCharCode(b);}return btoa(s)}
function unb64(str,n){const s=atob(str),u=new Uint8Array(n);for(let i=0;i<s.length;i++){const b=s.charCodeAt(i);for(let k=0;k<8;k++)if(b&(1<<k)&&i*8+k<n)u[i*8+k]=1;}return u}
function worldSave(){if(!W)return;S.world={n:W.n,seed:W.seed,diff:W.diff||0,g:W.gal,p:W.pl,dest:b64(W.dest),rev:b64(W.rev),hd:W.hd,steps:W.steps,pen:W.pen,gs:W.gSpawned,mx:Math.floor(MX/T),my:Math.floor(MY/T)}}

}
function solidT(tx,ty){if(!W||tx<0||ty<0||tx>=W.n||ty>=W.n)return true;return W.g[ty*W.n+tx]>=0}
const solidAt=(x,y)=>solidT(Math.floor(x/T),Math.floor(y/T));
function reveal(cx,cy,r){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){if(x*x+y*y>r*r)continue;const tx=cx+x,ty=cy+y;if(tx<0||ty<0||tx>=W.n||ty>=W.n)continue;W.rev[ty*W.n+tx]=1;}W.miniDirty=true}
function distM(i){const n=W.n,x=i%n,y=(i/n)|0,c=n/2,d=Math.min(1,Math.hypot(x+.5-c,y+.5-c)/(n/2));return 1+2*Math.pow(d,1.5)}
function blockFull(i){return hpScale(S.wave)*3*BT[W.g[i]].hp*distM(i)*wHpM()}
function blockObj(tx,ty){
  const i=ty*W.n+tx;const t=W.g[i];if(t<0||t===BED)return null;
  let o=R.bo.get(i);if(o&&!o.dead)return o;
  const full=blockFull(i);o={isBlock:true,i,tx,ty,x:(tx+.5)*T,y:(ty+.5)*T,r:T*.5,hp:W.hp[i]>0?W.hp[i]:full,max:full,dead:false,flash:0,acc:0,accT:0};R.bo.set(i,o);return o;
}
function blocksIn(x,y,r){const out=[];const t0x=Math.floor((x-r)/T),t1x=Math.floor((x+r)/T),t0y=Math.floor((y-r)/T),t1y=Math.floor((y+r)/T);
  for(let ty=t0y;ty<=t1y;ty++)for(let tx=t0x;tx<=t1x;tx++){if(tx<0||ty<0||tx>=W.n||ty>=W.n)continue;const g=W.g[ty*W.n+tx];if(g<0||g===BED)continue;if(Math.hypot((tx+.5)*T-x,(ty+.5)*T-y)<r+T*.5){const o=blockObj(tx,ty);if(o)out.push(o);}}return out}
function nearestBlock(x,y,maxTiles){const cx=Math.floor(x/T),cy=Math.floor(y/T);let best=null,bd=1e9;
  for(let oy=-maxTiles;oy<=maxTiles;oy++)for(let ox=-maxTiles;ox<=maxTiles;ox++){const tx=cx+ox,ty=cy+oy;if(tx<0||ty<0||tx>=W.n||ty>=W.n)continue;const g=W.g[ty*W.n+tx];if(g<0||g===BED)continue;const d=ox*ox+oy*oy;if(d<bd){bd=d;best=[tx,ty];}}
  return best?blockObj(best[0],best[1]):null}
function killBlock(o){
  o.dead=true;R.bo.delete(o.i);if(R.focus===o)R.focus=null;
  const t=W.g[o.i];if(t<0)return;W.g[o.i]=-1;W.dest[o.i]=1;W.hp[o.i]=0;W.destroyed++;S.stats.blocks=(S.stats.blocks||0)+1;
  earn(rewScale(S.wave)*.5*BT[t].val*wRewM());
  if(BT[t].gem&&Math.random()<.6){S.crystals++;R.parts.push({x:o.x,y:o.y,vx:0,vy:-30,life:.8,max:.8,col:'#7ff3ff',size:18,type:'ring'});}
  const col=BT[t].ore||BT[t].top;
  shatterBlock(o,t,MX,MY-30);if(Math.random()<.35)noise(.025,.12);
  R.parts.push({x:o.x,y:o.y,vx:rnd(-10,10),vy:-20,life:.7,max:.7,col:'#3a3530',size:12,type:'smoke'});
  if(BT[t].val>=4||Math.random()<.3)R.orbs.push({x:o.x,y:o.y,vx:rnd(-40,40),vy:rnd(-60,0),t:0});
  if(Math.random()<.12)snd(rnd(140,220),.06,'square',.015);
  reveal(o.tx,o.ty,1);W.flowDirty=true;
  const st=Math.min(4,Math.floor(W.destroyed/(W.total*.8)*4));if(st>W.steps){W.steps=st;W.pen=Math.max(0,W.pen-1);setLevel(true);}
  if(!W.gSpawned&&W.destroyed>=W.total*.8)spawnGuardian();
}
function setLevel(announce){
  const L=Math.max(planetBase(W.gal,W.pl),planetBase(W.gal,W.pl)+W.steps-W.pen);const up=L>S.wave;S.wave=L;
  if(S.wave>S.maxWaveRun)S.maxWaveRun=S.wave;if(S.wave>S.bestWave)S.bestWave=S.wave;
  const ten=Math.floor((S.wave-1)/10);if(ten>S.firstTen){S.firstTen=ten;S.crystals+=5;toast('Milestone: Level '+(ten*10)+' reached  +5 ◆','#3fe0ff');}
  if(announce&&up){banner('THREAT LEVEL '+S.wave,'#ffa62b');for(const [,o] of R.bo){o.max=blockFull(o.i);}}

// BFS flow field from the mech over open tiles (enemies descend it; the mech uses it to plan digs)
function computeFlow(){
  const n=W.n,F=W.flow;F.fill(INF);const mt=Math.floor(MX/T),my=Math.floor(MY/T);const st=my*n+mt;if(W.g[st]>=0)W.g[st]=-1;
  const q=new Int32Array(n*n);let h=0,tl=0;q[tl++]=st;F[st]=0;W.order.length=0;
  while(h<tl){const i=q[h++];W.order.push(i);const x=i%n,y=(i/n)|0,d=F[i]+1;
    for(const [ox,oy] of N8){const nx=x+ox,ny=y+oy;if(nx<0||ny<0||nx>=n||ny>=n)continue;const j=ny*n+nx;if(W.g[j]>=0||F[j]<=d)continue;if(ox&&oy&&(W.g[y*n+nx]>=0||W.g[ny*n+x]>=0))continue;F[j]=d;q[tl++]=j;}}

function pickDig(){
  const n=W.n,F=W.flow,M=R.mech;let best=null,bs=1e9,stand=-1;
  if(R.focus&&R.focus.isBlock&&!R.focus.dead){M.dig=R.focus;}
  else{
    for(const i of W.order){const d=F[i];if(d>bs+8)break;const x=i%n,y=(i/n)|0;
      for(let k=0;k<4;k++){const [ox,oy]=N8[k];const j=(y+oy)*n+x+ox;const g=W.g[j];if(g<0||g===BED)continue;const sc2=d-Math.min(6,BT[g].val*.35)+(W.rev[j]?0:1.5);if(sc2<bs){bs=sc2;best=[x+ox,y+oy];stand=i;}}}
    M.dig=best?blockObj(best[0],best[1]):null;

  M.path=[];if(!M.dig)return;

function mechAI(dt){
  const M=R.mech;M.retarget-=dt;M.moving=false;

  if(!M.dig)return;

  while(M.path.length&&Math.hypot(M.path[0][0]-MX,M.path[0][1]-MY)<3)M.path.shift();
  if(!M.path.length){M.retarget=Math.min(M.retarget,.2);return;}
  const [px,py]=M.path[0];if(solidAt(px,py)){M.retarget=0;return;}
  const dx=px-MX,dy=py-MY,d=Math.hypot(dx,dy)||1,sp=Math.min(d,(78+lvl('servos')*6)*dt);MX+=dx/d*sp;MY+=dy/d*sp;M.moving=true;

}
function los(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/12);for(let k=1;k<n;k++){const f=k/n;if(solidAt(x1+(x2-x1)*f,y1+(y2-y1)*f))return false;}return true}

/* ================= RUBBLE PHYSICS ================= */
const CHUNK_MAX=320,GRAV=720;
function addChunk(c){R.chunks.push(c);if(R.chunks.length>CHUNK_MAX)R.chunks.splice(0,R.chunks.length-CHUNK_MAX);}
function mkChunk(x,y,z,vx,vy,vz,s,top,side,life){return{x,y,z,vx,vy,vz,rot:Math.random()*TAU,vr:rnd(-14,14),s,top,side,life,max:life}}
// a destroyed block splits into a 3x3 of tumbling chunks plus crumbs, thrown away from the hit
function shatterBlock(o,t,fx,fy){
  const b=BT[t],g=3,cs=T/g;let ax=o.x-fx,ay=o.y-fy;const ad=Math.hypot(ax,ay)||1;ax/=ad;ay/=ad;
  for(let gy=0;gy<g;gy++)for(let gx=0;gx<g;gx++){
    const cx=o.x-T/2+(gx+.5)*cs,cy=o.y-T/2+(gy+.5)*cs,ox=cx-o.x,oy=cy-o.y,sp=rnd(40,150);
    const ore=b.ore&&Math.random()<.45;
    addChunk(mkChunk(cx,cy,rnd(6,16),ox*5+ax*sp*.7+rnd(-35,35),oy*5+ay*sp*.7+rnd(-35,35),rnd(90,260),cs*rnd(.6,1),ore?b.ore:b.top,b.side,rnd(3.5,6)));}
  for(let k=0;k<7;k++){const a=Math.random()*TAU,v=rnd(50,170);addChunk(mkChunk(o.x+rnd(-8,8),o.y+rnd(-8,8),rnd(4,14),Math.cos(a)*v,Math.sin(a)*v,rnd(60,200),rnd(2,4),k<3&&b.ore?b.ore:b.side,b.side,rnd(2,3.5)));}
}
// a hit knocks a small chip off the face toward the shooter
function chipBlock(o,sx,sy){const g=W.g[o.i];if(g<0||g===BED)return;const b=BT[g];
  const a=Math.atan2(sy-o.y,sx-o.x)+rnd(-.9,.9),v=rnd(60,160);
  addChunk(mkChunk(o.x+Math.cos(a)*T*.45,o.y+Math.sin(a)*T*.45,rnd(4,16),Math.cos(a)*v,Math.sin(a)*v,rnd(40,160),rnd(2,4.5),b.ore&&Math.random()<.4?b.ore:b.top,b.side,rnd(1.4,2.4)));}
function kickChunks(x,y,r,f){for(const c of R.chunks){if(c.z>3)continue;const dx=c.x-x,dy=c.y-y;if(dx>r||dx<-r||dy>r||dy<-r)continue;const d=Math.hypot(dx,dy)||1;if(d<r){const imp=(r-d)*7*f;c.vx+=dx/d*imp;c.vy+=dy/d*imp;c.vz+=imp*.25;c.vr+=rnd(-5,5);if(c.life<1.2)c.life=1.2;}}}
function blastChunks(x,y,r,pw){for(const c of R.chunks){const dx=c.x-x,dy=c.y-y,d=Math.hypot(dx,dy)||1;if(d>r)continue;const k=(1-d/r)*pw;c.vx+=dx/d*k;c.vy+=dy/d*k;c.vz+=k*.7;c.vr+=rnd(-15,15);if(c.life<1.5)c.life=1.5;}}
function updChunks(dt){
  const fr=Math.pow(.015,dt),rf=Math.pow(.04,dt);
  for(const c of R.chunks){c.life-=dt;
    if(c.z>0||c.vz>0){c.vz-=GRAV*dt;c.z+=c.vz*dt;if(c.z<=0){c.z=0;if(c.vz<-70){c.vz=-c.vz*.38;c.vx*=.65;c.vy*=.65;c.vr*=.55;}else c.vz=0;}}
    if(c.z===0){c.vx*=fr;c.vy*=fr;c.vr*=rf;}
    const nx=c.x+c.vx*dt;if(c.z<T&&solidAt(nx,c.y)){c.vx*=-.45;}else c.x=nx;
    const ny=c.y+c.vy*dt;if(c.z<T&&solidAt(c.x,ny)){c.vy*=-.45;}else c.y=ny;
    c.rot+=c.vr*dt;}
  if(R.mech&&R.mech.moving)kickChunks(MX,MY,24,1);
  R.kickF^=1;if(R.kickF){let n=0;for(const e of R.en){if(e.def.fly||e.dead)continue;kickChunks(e.x,e.y,e.r+5,.7);if(++n>40)break;}}
  R.chunks=R.chunks.filter(c=>c.life>0);
}
function drawChunks(){
  const L=R.cam.x-VW/2-20,Rr=R.cam.x+VW/2+20,Tt=R.cam.y-VH/2-30,B=R.cam.y+VH/2+30;
  ctx.fillStyle='rgba(0,0,0,.3)';
  for(const c of R.chunks){if(c.x<L||c.x>Rr||c.y<Tt||c.y>B||c.z<1)continue;const k=Math.max(.3,1-c.z/120);ctx.beginPath();ctx.ellipse(c.x,c.y+2,c.s*.6*k,c.s*.3*k,0,0,TAU);ctx.fill();}
  for(const c of R.chunks){if(c.x<L||c.x>Rr||c.y<Tt||c.y>B)continue;
    ctx.globalAlpha=Math.min(1,c.life/.7);const h=c.s/2,co=Math.cos(c.rot),si=Math.sin(c.rot),x=c.x,y=c.y-c.z;
    const q=(dy)=>{ctx.beginPath();ctx.moveTo(x+(-h)*co-(-h)*si,y+dy+(-h)*si+(-h)*co);ctx.lineTo(x+h*co-(-h)*si,y+dy+h*si+(-h)*co);ctx.lineTo(x+h*co-h*si,y+dy+h*si+h*co);ctx.lineTo(x+(-h)*co-h*si,y+dy+(-h)*si+h*co);ctx.closePath();ctx.fill();};
    ctx.fillStyle=c.side;q(Math.min(3,c.s*.35));ctx.fillStyle=c.top;q(0);}
  ctx.globalAlpha=1;
}

/* ================= BLOOD, OIL & DAMAGE STREAMS ================= */
const BLOOD={crawler:'#8fdc2a',spitter:'#c6ff45',flyer:'#b06bff',brute:'#d9a21f',queen:'#ff3d9a',hive:'#ff4d9a'};
const OIL='#141414',ROBOT={stalker:1};
const isRobot=t=>!!ROBOT[t.type];
function addSplat(x,y,r,col,n){if(solidAt(x,y))return;const blobs=[[0,0,r]];for(let k=0;k<(n||4);k++){const a=Math.random()*TAU,d=r*rnd(.6,1.5);blobs.push([Math.cos(a)*d,Math.sin(a)*d*.75,r*rnd(.15,.45)]);}
  R.splats.push({x,y,col,blobs,a:col===OIL?.7:.62,life:45});if(R.splats.length>170)R.splats.shift();}
function spray(x,y,col,n,ang,spread,pw){for(let k=0;k<n;k++){const a=ang+rnd(-spread,spread),v=rnd(.4,1)*pw;R.drops.push({x,y,z:rnd(6,18),vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:rnd(40,170),col,s:rnd(1.5,3.2)});}if(R.drops.length>260)R.drops.splice(0,R.drops.length-260);}
// called on every hit to a living thing
function bleed(t,crit,cont){
  if(Math.random()>(cont?.07:crit?.9:.45))return;
  const ang=Math.atan2(t.y-(MY-30),t.x-MX);
  if(t.isHive){spray(t.x,t.y,BLOOD.hive,3,ang,.9,140);return;}
  if(isRobot(t)){sparks(t.x,t.y,crit?6:3,'#ffd27a');spray(t.x,t.y,OIL,2,ang,.7,110);return;}
  spray(t.x,t.y-(t.def.fly?12:0),BLOOD[t.type]||'#8fdc2a',crit?6:3,ang,.7,crit?190:140);
}
function gib(e){
  const big=e.type==='brute'||e.boss,ang=Math.atan2(e.y-MY,e.x-MX),y=e.y;
  if(isRobot(e)){addSplat(e.x,y,e.r*1.1,OIL,5);sparks(e.x,e.y,14,'#ffd27a');
    for(let k=0;k<5;k++)R.parts.push({x:e.x+rnd(-6,6),y:e.y,vx:rnd(-15,15),vy:rnd(-55,-25),life:rnd(.8,1.4),max:1.4,col:'#2a2f35',size:rnd(6,10),type:'smoke'});
    for(let k=0;k<4;k++){const a=Math.random()*TAU,v=rnd(60,150);addChunk(mkChunk(e.x,e.y,rnd(6,14),Math.cos(a)*v,Math.sin(a)*v,rnd(80,200),rnd(3,5),'#9aa6b1','#4c5661',rnd(2,3.5)));}
    return;}
  const col=BLOOD[e.type]||'#8fdc2a';
  addSplat(e.x,y,e.r*(big?1.5:1.1),col,big?8:5);
  spray(e.x,y,col,big?18:9,ang,1.4,big?260:190);
}
function updGore(dt){
  for(const d of R.drops){d.vz-=GRAV*dt;d.z+=d.vz*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;
    if(d.z<=0){d.dead=true;if(!solidAt(d.x,d.y)){if(Math.random()<.55)addSplat(d.x,d.y,d.s*rnd(1,1.8),d.col,1);}}else if(solidAt(d.x,d.y)&&d.z<T)d.dead=true;}
  R.drops=R.drops.filter(d=>!d.dead);
  for(const p of R.splats)p.life-=dt;R.splats=R.splats.filter(p=>p.life>0);
  // the mech leaks smoke, sparks and oil as its hull drops
  const hf=S.hull/D.hull,tx=MX,ty=MY-34;
  if(hf<.65&&Math.random()<(.65-hf)*1.4)R.parts.push({x:tx+rnd(-8,8),y:ty,vx:rnd(-10,10),vy:rnd(-55,-30),life:rnd(.7,1.3),max:1.3,col:hf<.3?'#1c1c1e':'#3a4048',size:rnd(5,9),type:'smoke'});
  if(hf<.45&&Math.random()<.08)sparks(tx+rnd(-12,12),ty+rnd(-6,6),3,'#ffd27a');
  if(hf<.3&&Math.random()<.25)R.parts.push({x:tx+rnd(-8,8),y:ty+4,vx:rnd(-12,12),vy:rnd(-60,-30),life:.4,max:.4,col:'#ff7a1a',size:rnd(4,7),type:'fire'});
  if(hf<.5&&R.mech.moving&&Math.random()<.06)addSplat(MX+rnd(-10,10),MY+rnd(-2,4),rnd(2,4),OIL,1);
}
function drawGore(){
  const L=R.cam.x-VW/2-40,Rr=R.cam.x+VW/2+40,Tt=R.cam.y-VH/2-40,B=R.cam.y+VH/2+40;
  for(const p of R.splats){if(p.x<L||p.x>Rr||p.y<Tt||p.y>B)continue;ctx.globalAlpha=p.a*Math.min(1,p.life/6);ctx.fillStyle=p.col;
    for(const [dx,dy,r] of p.blobs){ctx.beginPath();ctx.ellipse(p.x+dx,p.y+dy,r,r*.75,0,0,TAU);ctx.fill();}
    if(p.col!==OIL&&p.blobs.length>2){ctx.globalAlpha*=.5;ctx.fillStyle='rgba(255,255,255,.5)';const [,,r]=p.blobs[0];ctx.beginPath();ctx.ellipse(p.x-r*.3,p.y-r*.25,r*.25,r*.12,0,0,TAU);ctx.fill();}}
  ctx.globalAlpha=1;
}
function drawDrops(){for(const d of R.drops){ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(d.x,d.y-d.z,d.s,0,TAU);ctx.fill();}}

/* ================= SPAWNING ================= */
function pickType(w){
  const t=[['crawler',10],['stalker',w>=3?4:0],['spitter',w>=5?3:0],['flyer',w>=8?3:0],['brute',w>=6?1+w/20:0]];
  let sum=0;for(const x of t)sum+=x[1];let r=Math.random()*sum;for(const x of t){r-=x[1];if(r<=0)return x[0];}return 'crawler';
}
function mkEnemy(type,x,y,sq,counted){
  const d=EN[type],hp=hpScale(S.wave)*d.hp*2.5*wHpM();
  return{type,def:d,x,y,vx:0,vy:0,hp,max:hp,r:d.r,spd:d.spd*rnd(.9,1.12),armor:d.armor||0,boss:!!d.boss,sq,ox:rnd(-1,1),oy:rnd(-1,1),t:Math.random()*10,flash:0,atk:rnd(.3,1),counted,ang:Math.PI*.8,burn:0,burnD:0,acc:0,accT:0,spawnT:4,dead:false,dmgM:1.6*Math.sqrt(dTier().hp)*Math.pow(bossThreat(),.3)};
}
function edgePoint(){const side=Math.floor(Math.random()*4);
  if(side===0)return[VW*rnd(.02,.98),-30];if(side===1)return[VW*rnd(.02,.98),VH+30];if(side===2)return[-30,VH*rnd(.05,.95)];return[VW+30,VH*rnd(.05,.95)];}
function hivePos(){for(let t=0;t<30;t++){const a=Math.random()*TAU;const x=MX+Math.cos(a)*VW*.4,y=MY+Math.sin(a)*VH*.4;
  if(x>40&&x<VW-40&&y>45&&y<VH-40&&Math.hypot(x-MX,y-MY)>140&&!R.hives.some(h=>Math.hypot(h.x-x,h.y-y)<90))return[x,y];}return[VW*.85,VH*.2];}
function spawnSquad(n){
  const [sx,sy]=edgePoint();
  const flank=[-1,0,1][Math.floor(Math.random()*3)];
  const a0=Math.atan2(sy-MY,sx-MX)+flank*.6;
  const RR=Math.min(VW,VH)*.4;const sq={flank,ax:clamp(MX+Math.cos(a0)*RR,30,VW-30),ay:clamp(MY+Math.sin(a0)*RR*.9,25,VH-20),state:'march',timer:0};
  R.sq.push(sq);
  const type=pickType(S.wave);
  for(let i=0;i<n;i++){
    const t=i===0||Math.random()<.7?type:pickType(S.wave);
    const e=mkEnemy(t,sx+rnd(-18,18),sy+rnd(-18,18),sq,true);
    e.ox=((i%3)-1)*24;e.oy=Math.floor(i/3)*22-20;
    R.en.push(e);R.wv.spawned++;
  }
}
function spawnHive(){
  const w=S.wave;const hp=hpScale(w)*45*bossThreat();
  const [hx,hy]=hivePos();R.hives.push({isHive:true,x:hx,y:hy,hp,max:hp,r:28,lvl:1,spawnT:3,alive:0,flash:0,acc:0,accT:0,t:0,dead:false});
  toast('⚠ A Hive has emerged — tap it to focus fire','#ff4d9a');
}
function startWave(){
  R.wv={total:waveTotal(S.wave),spawned:0,killed:0,boss:S.wave%10===0,bossSpawned:false,done:false,squadT:S.wave===1?2.5:1.4};
  R.sq=R.sq.filter(s=>R.en.some(e=>e.sq===s));
  if(S.wave%5===0&&R.hives.length<2&&!R.hives.some(h=>h.bornWave===S.wave)){spawnHive();R.hives[R.hives.length-1].bornWave=S.wave;}
  if(R.wv.boss)banner('⚠ QUEEN WAVE '+S.wave,'#ff4d9a');else banner('WAVE '+S.wave,'#3fe0ff');
}
function onWaveClear(){
  for(const h of R.hives){h.alive++;if(h.alive>=3){h.alive=0;h.lvl++;h.max*=1.6;h.hp=Math.min(h.max,h.hp*1.6);toast('Hive evolved to Lv.'+h.lvl+' — spawns faster','#ff4d9a');}}
  if(!S.farm)S.wave++;
  if(S.wave>S.maxWaveRun)S.maxWaveRun=S.wave;
  if(S.wave>S.bestWave)S.bestWave=S.wave;
  const ten=Math.floor((S.wave-1)/10);
  if(ten>S.firstTen){S.firstTen=ten;S.crystals+=5;toast('Milestone: Wave '+(ten*10)+' cleared  +5 ◆','#3fe0ff');}
  startWave();
}

/* ================= COMBAT ================= */
function earn(v){v*=D.scrap*(boostOn()?2:1);S.money+=v;S.stats.earned+=v;R.incAcc+=v;return v}
function addNum(x,y,v,crit){if(R.nums.length>70)R.nums.shift();R.nums.push({x:x+rnd(-6,6),y,v,crit,life:crit?.9:.65,max:crit?.9:.65})}
function hit(t,dmg,crit,o){
  if(t.dead)return;o=o||{};
  if(t.isBlock){dmg*=D.drill;t.hp-=dmg;t.flash=.07;if(Math.random()<(o.cont?.12:.4))chipBlock(t,MX,MY-30);W.hp[t.i]=Math.max(.0001,t.hp);if(t.hp<=0)killBlock(t);return;}
  if(t.boss||t.isHive)dmg*=D.boss;
  if(t.armor&&!o.pierce)dmg*=1-t.armor;
  t.hp-=dmg;t.flash=.07;if(!o.sec||Math.random()<.3)bleed(t,crit,o.cont);
  if(o.cont){t.acc+=dmg;}else addNum(t.x,t.y-t.r-8,dmg,crit);
  if(crit&&!o.cont)sparks(t.x,t.y,4,'#ff5a5a');
  if(t.hp<=0){if(t.acc>0){addNum(t.x,t.y-t.r-8,t.acc,false);t.acc=0;}t.isHive?killHive(t):killEnemy(t);}
}
function rollCrit(){return Math.random()<D.crit}
function killEnemy(e){
  e.dead=true;
  if(R.focus===e)R.focus=null;
  let rw=rewScale(S.wave)*e.def.rew*(e.counted?1:.5)*wRewM();
  earn(rw);
  S.stats.kills++;
  const big=e.type==='brute'||e.boss;
  gib(e);
  boom(e.x,e.y,big?2.2:1,e.type==='spitter'?'#8dff5a':e.type==='flyer'?'#c58bff':'#ffa62b');
  R.scorch.push({x:e.x,y:e.y,r:e.r*(big?1.6:1.1),a:.5});if(R.scorch.length>50)R.scorch.shift();
  for(let i=0;i<(big?5:1);i++)R.orbs.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-80,10),t:0});
  if(e.type==='brute'){S.stats.brutes++;if(Math.random()<.05)dropModule(0,e.x,e.y);if(Math.random()<.02)gainCache('Brute');}
  else if(e.boss){if(e.guardian&&!R.en.some(x=>x!==e&&x.guardian&&!x.dead)){W.gDead=true;W.clearT=2.5;banner('PLANET CLEARED','#5dff9b');}S.stats.queens++;const T=e.threat||1;const c=Math.round((6+D.prospect+Math.floor(S.wave/10))*T);if(T>=2.5)gainCache('Queen bonus');earn(rewScale(S.wave)*40*T*dTier().rew);S.crystals+=c;gainCache('Queen');dropModule(1.5,e.x,e.y);toast('Queen destroyed  +'+c+' ◆','#ff4d9a');R.shake=14;noise(.18,.7);}
  else if(Math.random()<.002)dropModule(0,e.x,e.y);
  if(big)R.shake=Math.max(R.shake,6);
  if(Math.random()<.25)noise(.035,.18);
}
function killHive(h){
  addSplat(h.x,h.y,40,BLOOD.hive,10);spray(h.x,h.y,BLOOD.hive,24,0,Math.PI,260);
  h.dead=true;if(R.focus===h)R.focus=null;if(h.k!=null&&W&&!W.hd.includes(h.k))W.hd.push(h.k);
  const c=3+Math.floor(S.wave/10)+D.prospect+(h.lvl-1);S.crystals+=c;
  earn(rewScale(S.wave)*30*h.lvl*wRewM());S.stats.hives++;
  for(let i=0;i<4;i++)setTimeout(()=>boom(h.x+rnd(-20,20),h.y+rnd(-15,15),2,'#ff4d9a'),i*120);
  R.scorch.push({x:h.x,y:h.y,r:40,a:.7});
  dropModule(.8,h.x,h.y);gainCache('Hive');R.shake=12;noise(.2,.6);snd(220,.5,'sawtooth',.05,.3);
  toast('Hive destroyed  +'+c+' ◆','#ff4d9a');
}
function hurt(v){
  v*=D.taken;S.hull-=v;if(Math.random()<.5){sparks(MX+rnd(-14,14),MY-30+rnd(-10,10),5,'#ffd27a');spray(MX,MY-28,OIL,2,Math.random()*TAU,Math.PI,90);}R.hurtT=.25;R.shake=Math.max(R.shake,3);
  if(S.hull<=0)breach();
}
function breach(){
  R.en=[];R.ep=[];R.focus=null;
  W.pen=Math.min(W.pen+2,W.steps);setLevel();S.farm=true;S.hull=D.hull;
  boom(MX,MY-20,3,'#ff4d5e');
  const c=Math.floor(W.n/2);MX=(c+.5)*T;MY=(c+.5)*T;R.cam={x:MX,y:MY};R.mech.path=[];R.mech.dig=null;W.flowDirty=true;
  banner('MECH DESTROYED','#ff4d5e');
  toast('Rebuilt at the landing pad. Threat −2, Farm mode ON (replays this planet). Upgrade, then tap AUTO','#ff4d5e');
  R.shake=16;noise(.2,.8);R.spawnT=6;
  if(W.gSpawned&&!W.gDead){W.gSpawned=false;}
}
function nearest(x,y,max,skip){let b=null,bd=max?max*max:1e12;for(const e of R.en){if(e.dead||e===skip)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e;}}return b}
function getTarget(range){
  const cx=MX,cy=MY-30,rg=range||330;
  if(R.focus&&!R.focus.dead&&Math.hypot(R.focus.x-cx,R.focus.y-cy)<Math.max(rg,420))return R.focus;
  const e=nearest(cx,cy,rg);if(e)return e;
  for(const h of R.hives)if(!h.dead&&Math.hypot(h.x-cx,h.y-cy)<rg)return h;
  const d=R.mech&&R.mech.dig;if(d&&!d.dead&&Math.hypot(d.x-cx,d.y-cy)<Math.min(rg,T*5))return d;
  return nearestBlock(cx,cy,Math.max(1,Math.min(5,Math.floor(rg/T))));
}
const MOUNT=[[12,17],[12,-17],[-6,-12],[-15,0],[6,9],[0,-2]];
const GLEN={bullet:15,missile:8,beam:13,chain:4,cone:11,rail:30,mortar:9};
function muzzle(i){const s=R.ws[i];const [mx,my]=MOUNT[i];const lx=mx+(s?GLEN[s.kind]:10),ly=my;const c=Math.cos(R.aim),sn=Math.sin(R.aim);return[MX+lx*c-ly*sn,MY-30+lx*sn+ly*c]}
function nearestN(x,y,n,max,excl){const arr=[];for(const e of R.en){if(e.dead||(excl&&excl.has(e)))continue;const d=(e.x-x)**2+(e.y-y)**2;if(max&&d>max*max)continue;arr.push([d,e]);}arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1])}
function threat(){return nearestN(MX,MY-12,1,115)[0]}
function toughest(){let t=null,b=-1;for(const e of R.en){if(!e.dead&&e.hp>b&&Math.hypot(e.x-MX,e.y-MY)<360){b=e.hp;t=e;}}return t}
function rollHit(s){const c=Math.random()<D.crit+s.crit;return[c,c?D.critDmg+s.critMult:1]}
// central on-hit: damage + element + perk + leech
function strike(t,s,dmg,crit,o){
  if(!t||t.dead)return;o=o||{};
  if(t.boss||t.isHive)dmg*=s.bossM;if(R.od>0)dmg*=s.odM;
  hit(t,dmg,crit,o);
  if(o.sec)return;
  applyEl(t,s,dmg,o.cont);
  const pc=o.cont?.3:1;
  if(s.perks.storm&&Math.random()<pc){const ns=nearestN(t.x,t.y,3,120,new Set([t]));if(ns.length){R.arcs.push({pts:[[t.x,t.y],...ns.map(e=>[e.x,e.y])],life:.12,col:s.col});for(const e of ns)hit(e,dmg*s.perks.storm,false,{sec:true,cont:o.cont});}}

const rarCap=()=>Math.min(5,2+S.prestiges);

}

  const sec=Math.min(ms/1000,8*3600);if(sec<30||!S.avgIncome)return;
  const v=S.avgIncome*sec*D.offline;S.money+=v;S.stats.earned+=v;
  openModal(`<h2>Welcome back, pilot</h2><p class="note">Your drones kept salvaging for ${Math.floor(sec/3600)}h ${Math.floor(sec%3600/60)}m.</p><div class="mrow mono" style="text-align:center;margin:14px 0;font-size:30px"><span style="color:#ffa62b">$</span> ${fmt(v)}</div><button class="unlock" data-act="close" style="margin:0">COLLECT</button>`);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){R.hiddenAt=Date.now();save();}else if(R.hiddenAt){offlineGain(Date.now()-R.hiddenAt);R.hiddenAt=0;last=performance.now();}});
window.addEventListener('pagehide',save);
window.addEventListener('resize',resize);

/* loop */
let last=performance.now(),uiT=0,panelT=0,saveT=0;
const fin=o=>isFinite(o.x)&&isFinite(o.y);
function sanitize(){R.parts=R.parts.filter(p=>fin(p)&&isFinite(p.size));R.scorch=R.scorch.filter(s=>fin(s)&&isFinite(s.r));R.pr=R.pr.filter(fin);R.ep=R.ep.filter(fin);R.orbs=R.orbs.filter(fin);R.nums=R.nums.filter(fin);R.strikes=R.strikes.filter(fin);
  for(const e of R.en)if(!fin(e)){e.dead=true;}if(!isFinite(MX)||!isFinite(MY)){const c=Math.floor(W.n/2);MX=(c+.5)*T;MY=(c+.5)*T;}for(const d of R.drones)if(!fin(d)){d.x=MX;d.y=MY-30;}R.beams=R.beams.filter(b=>isFinite(b.x1+b.y1+b.x2+b.y2));R.arcs=[];if(!isFinite(R.aim))R.aim=-.5;}
let errN=0,lastFrame=performance.now(),rafId=0;
setInterval(()=>{if(!document.hidden&&performance.now()-lastFrame>1500){cancelAnimationFrame(rafId);last=performance.now();rafId=requestAnimationFrame(loop);}},1000);
function loop(now){
  lastFrame=performance.now();
  rafId=requestAnimationFrame(loop);
  try{step(now);errN=0;}catch(e){errN++;try{console.error(e);sanitize();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}catch(_){}
    if(errN===30)toast('Recovered from a glitch','#ff4d5e');}
}
function step(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  if(!R.paused){update(dt);if(S.speed===2&&!R.paused)update(dt);}else{R.time+=dt*.2;}draw();
  uiT+=dt;panelT+=dt;saveT+=dt;
  if(uiT>.15){uiT=0;hud();updatePanel();drawMini();}
  if(panelT>1){panelT=0;if(!R.pdown&&!$('#modal').classList.contains('on'))renderPanel();if(modalKind==='missions'&&!R.pdown)showMissions();}
  if(saveT>5){saveT=0;save();}
}
load();resize();recalc();fillMissions();
if(S.world)loadWorld(S.world);else{const idx=Math.max(1,Math.floor((S.wave-1)/5)+1);newPlanet(Math.floor((idx-1)/5)+1,(idx-1)%5+1);}
renderPanel();hud();
setTimeout(()=>{if(W&&recTier()>(W.diff||0))toast(`Too easy? Tap “G${W.gal}·P${W.pl}” to play ${DIFF[recTier()].n} for ×${DIFF[recTier()].rew} rewards`,DIFF[recTier()].col);},2500);
if(S.hp[0]&&!S.hp[0].w){S.hp[0].w=newGun(0);recalc();renderPanel();}
if(S.last)offlineGain(Date.now()-S.last);
else toast('Tap enemies or Hives to focus fire. Buy upgrades below.','#3fe0ff');
requestAnimationFrame(loop);
</script>
</body>
