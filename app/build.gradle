plugins {
    id 'com.android.application'
}

android {
    namespace 'com.motoxjas.mechsiege'
    compileSdk 34

    defaultConfig {
        applicationId 'com.motoxjas.mechsiege'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    // The game lives in /www so it can be edited without touching Android code
    sourceSets {
        main {
            assets.srcDirs = ['../www']
        }
    }

    // TEST-ONLY key, committed on purpose so every CI build has the same signature
    // and installs as an update. The repo is public: replace with a private
    // upload key (GitHub secret) before publishing to the Play Store.
    signingConfigs {
        test {
            storeFile file('mechsiege-test.jks')
            storePassword 'mechsiege-test'
            keyAlias 'mechsiege'
            keyPassword 'mechsiege-test'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
