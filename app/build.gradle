plugins {
    id 'com.android.application'
}

android {
    namespace 'com.motoxjas.mechsiege'
    compileSdk 34

    defaultConfig {
        applicationId 'com.motoxjas.mechsiege'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    // The game lives in /www so it can be edited without touching Android code
    sourceSets {
        main {
            assets.srcDirs = ['../www']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly for testing.
            // Swap in a real keystore before uploading to the Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
